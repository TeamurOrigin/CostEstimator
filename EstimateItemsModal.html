<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{
      --bg:#070d18;
      --panel:rgba(15,23,42,.72);
      --panel2:rgba(2,6,23,.42);
      --text:#e7eefc;
      --muted:#95a6c7;
      --border:rgba(148,163,184,.16);
      --border2:rgba(148,163,184,.10);
      --accent:#38bdf8;
      --green:#34d399;
      --red:#ef4444;
      --shadow:0 18px 70px rgba(0,0,0,.55);
      --shadow2:0 10px 28px rgba(0,0,0,.35);
      --r:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:11.5px;
      line-height:1.2;
      color:var(--text);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
        radial-gradient(900px 420px at 88% 0%, rgba(52,211,153,.13), transparent 55%),
        radial-gradient(900px 520px at 50% 110%, rgba(99,102,241,.10), transparent 55%),
        linear-gradient(180deg, #060b16 0%, #040816 100%);
      overflow:hidden;
    }

    .wrap{
      height:100%;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .top{
      flex:0 0 auto;
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.82), rgba(15,23,42,.62));
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .top:before{
      content:"";
      position:absolute;inset:-2px;
      background:
        radial-gradient(600px 140px at 18% 0%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(600px 160px at 86% 0%, rgba(52,211,153,.14), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }
    .top > *{position:relative;z-index:1}
    .title{font-weight:950;font-size:14px;letter-spacing:.2px}
    .status{
      font-size:10.8px;color:var(--muted);
      padding:5px 9px;
      border:1px solid var(--border2);
      border-radius:999px;
      background:rgba(2,6,23,.40);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      white-space:nowrap;
      max-width:60%;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .card{
      flex:1 1 auto;
      min-height:0;
      border:1px solid var(--border);
      border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.76), rgba(2,6,23,.44));
      box-shadow:var(--shadow2);
      overflow:hidden;
      position:relative;
      display:flex;
      flex-direction:column;
    }
    .card:before{
      content:"";
      position:absolute;inset:0;
      background:
        radial-gradient(800px 220px at 22% 0%, rgba(56,189,248,.10), transparent 55%),
        radial-gradient(800px 220px at 82% 0%, rgba(52,211,153,.08), transparent 55%);
      pointer-events:none;
      opacity:.9;
    }
    .card > *{position:relative;z-index:1}

    .h{
      flex:0 0 auto;
      padding:10px 12px;
      border-bottom:1px solid var(--border2);
      font-weight:950;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:linear-gradient(180deg, rgba(2,6,23,.32), rgba(2,6,23,.12));
    }

    .hLeft{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    #curTitle{font-size:12.2px;font-weight:950}
    #curSub{color:rgba(149,166,199,.85);font-size:10.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}

    .tools{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .pill{
      font-size:10.6px;color:var(--muted);
      padding:5px 9px;
      border:1px solid var(--border2);
      border-radius:999px;
      background:rgba(2,6,23,.35);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      white-space:nowrap;
    }

    .b{
      flex:1 1 auto;
      min-height:0;
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .btn{
      height:32px;
      padding:0 12px;
      border-radius:12px;
      border:1px solid var(--border2);
      background:linear-gradient(180deg, rgba(2,6,23,.55), rgba(2,6,23,.35));
      color:var(--text);
      font-weight:950;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
      transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,filter .12s ease;
      white-space:nowrap;
    }
    .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .btn:active{transform:translateY(0)}
    .btn.acc{
      border-color:rgba(56,189,248,.45);
      box-shadow:0 0 0 3px rgba(56,189,248,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .btn.green{
      border-color:rgba(52,211,153,.45);
      box-shadow:0 0 0 3px rgba(52,211,153,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .btn.red{
      border-color:rgba(239,68,68,.45);
      box-shadow:0 0 0 3px rgba(239,68,68,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .xbtn{height:28px;border-radius:11px;font-weight:950;padding:0 10px}

    .rowTools{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex:0 0 auto;
    }

    .itemsWrap{
      flex:1 1 auto;
      min-height:0;
      border:1px solid var(--border2);
      border-radius:14px;
      overflow:auto;
      background:rgba(2,6,23,.18);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.1px;table-layout:fixed}
    th,td{padding:6px 6px;border-bottom:1px solid rgba(148,163,184,.09);vertical-align:middle}
    th{
      color:rgba(149,166,199,.85);
      font-weight:950;
      text-align:center;
      background:rgba(2,6,23,.28);
      position:sticky;top:0;z-index:2;
      box-shadow:inset 0 -1px 0 rgba(148,163,184,.08);
      white-space:nowrap;
      font-size:10.3px;
      line-height:1.05;
    }

    .cellSelect{
      width:100%;
      height:28px;
      padding:4px 8px;
      font-size:11px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,.10);
      background:rgba(2,6,23,.46);
      color:var(--text);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
      outline:none;
      text-align:left;
    }
    .cellSelect:focus{
      border-color:rgba(56,189,248,.55);
      box-shadow:0 0 0 3px rgba(56,189,248,.10), inset 0 1px 0 rgba(255,255,255,.03);
    }

    .cellText{color:rgba(149,166,199,.8);font-size:10.5px;line-height:1.2}

    .col-cat{width:180px}
    .col-pos{width:260px}
    .col-comm{width:140px}
    .col-x{width:64px}

    .disabled{opacity:.55;pointer-events:none;filter:grayscale(.15)}

    .modalOverlay{
      position:fixed;
      inset:0;
      background:rgba(3,7,18,.65);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:20;
    }
    .modalOverlay.show{display:flex}
    .commentModal{
      width:420px;
      max-width:90vw;
      border-radius:16px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(2,6,23,.92));
      box-shadow:var(--shadow);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .commentModal h3{margin:0;font-size:12.5px}
    .commentModal textarea{
      min-height:110px;
      resize:vertical;
      border-radius:12px;
      border:1px solid var(--border2);
      background:rgba(2,6,23,.45);
      color:var(--text);
      padding:8px 10px;
      font-size:11.2px;
      outline:none;
    }
    .commentModal textarea:focus{
      border-color:rgba(56,189,248,.55);
      box-shadow:0 0 0 3px rgba(56,189,248,.12);
    }
    .commentModal .actions{
      display:flex;
      gap:8px;
      justify-content:flex-end;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Позиции проекта</div>
      <div class="status" id="status">Загрузка…</div>
    </div>

    <div class="card" id="itemsCard">
      <div class="h">
        <div class="hLeft">
          <div id="curTitle">Проект</div>
          <div id="curSub">Загрузка данных…</div>
        </div>
        <div class="tools">
          <span class="pill" id="curMeta">—</span>
          <button class="btn" id="btnBack">К проектам</button>
          <button class="btn" id="btnOpenSheet">Выгрузить на лист</button>
        </div>
      </div>

      <div class="b">
        <div class="rowTools">
          <button class="btn green" id="btnAddRow">Добавить позицию</button>
          <button class="btn acc" id="btnSave">Сохранить</button>
        </div>

        <div class="itemsWrap">
          <table>
            <thead>
              <tr>
                <th class="col-cat">Категория</th>
                <th class="col-pos">Позиция</th>
                <th class="col-comm">Комментарий</th>
                <th class="col-x"></th>
              </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modalOverlay" id="commentOverlay">
    <div class="commentModal">
      <h3>Комментарий к позиции</h3>
      <div class="cellText" id="commentMeta">—</div>
      <textarea id="commentInput" placeholder="Введите комментарий"></textarea>
      <div class="actions">
        <button class="btn" id="commentCancel">Отмена</button>
        <button class="btn acc" id="commentSave">Сохранить</button>
      </div>
    </div>
  </div>

<script>
  var BOOTSTRAP = <?!= JSON.stringify(bootstrap || null) ?>;

  var current = null;
  var items = [];
  var positionsByCategory = {};
  var positionsAll = [];
  var categories = [];
  var commentIdx = null;

  function $(id){return document.getElementById(id)}
  function setStatus(t){$('status').textContent=t}
  function arr(a){return a&&a.length?a:[]}

  function blankRow(){return{category:'',position:'',comment:''}}

  function disableUI(flag){
    var card=$('itemsCard');
    if(flag) card.classList.add('disabled'); else card.classList.remove('disabled');
  }

  function setHeader(est){
    if(!est){
      $('curTitle').textContent='Проект';
      $('curSub').textContent='Проект не найден';
      $('curMeta').textContent='—';
      return;
    }
    $('curTitle').textContent=est.name||'';
    $('curSub').textContent='Тип: '+(est.type||'—')+' • Группа: '+(est.group||'—');
    $('curMeta').textContent='Позиции: '+String(est.itemsCount||0);
  }

  function fillSelect(select, list, currentValue){
    select.innerHTML='';
    var emptyOpt=document.createElement('option');
    emptyOpt.value='';
    emptyOpt.textContent='—';
    select.appendChild(emptyOpt);
    for(var i=0;i<list.length;i++){
      var o=document.createElement('option');
      o.value=list[i];
      o.textContent=list[i];
      select.appendChild(o);
    }
    select.value=currentValue || '';
  }

  function renderItems(){
    var body=$('itemsBody'); body.innerHTML='';
    if(!current) return;

    for(var i=0;i<items.length;i++){
      (function(idx){
        var it=items[idx];
        var tr=document.createElement('tr');

        var tdCat=document.createElement('td');
        var selCat=document.createElement('select');
        selCat.className='cellSelect';
        fillSelect(selCat, categories, it.category);
        selCat.addEventListener('change', function(){
          items[idx].category = selCat.value;
          if(items[idx].position){
            var allowed = arr(positionsByCategory[selCat.value]);
            if(selCat.value && allowed.indexOf(items[idx].position) === -1){
              items[idx].position = '';
            }
          }
          renderItems();
        });
        tdCat.appendChild(selCat);

        var tdPos=document.createElement('td');
        var selPos=document.createElement('select');
        selPos.className='cellSelect';
        var list = selCat.value ? arr(positionsByCategory[selCat.value]) : positionsAll;
        fillSelect(selPos, list, it.position);
        selPos.addEventListener('change', function(){
          items[idx].position = selPos.value;
        });
        tdPos.appendChild(selPos);

        var tdCom=document.createElement('td');
        var btn=document.createElement('button');
        btn.className='btn xbtn';
        btn.textContent=it.comment ? 'Изменить' : 'Добавить';
        btn.addEventListener('click', function(){
          openCommentModal(idx);
        });
        tdCom.appendChild(btn);

        var tdX=document.createElement('td');
        var bx=document.createElement('button');
        bx.className='btn red xbtn';
        bx.textContent='×';
        bx.addEventListener('click', function(){
          items.splice(idx,1);
          if(!items.length) items.push(blankRow());
          renderItems();
          setHeader(current);
        });
        tdX.appendChild(bx);

        tr.appendChild(tdCat);
        tr.appendChild(tdPos);
        tr.appendChild(tdCom);
        tr.appendChild(tdX);
        body.appendChild(tr);
      })(i);
    }
  }

  function openCommentModal(idx){
    commentIdx = idx;
    var it = items[idx] || {};
    $('commentMeta').textContent = (it.category||'Без категории') + ' • ' + (it.position||'Без позиции');
    $('commentInput').value = it.comment || '';
    $('commentOverlay').classList.add('show');
  }

  function closeCommentModal(){
    $('commentOverlay').classList.remove('show');
    commentIdx = null;
  }

  function hydrateFromBootstrap(){
    if(!BOOTSTRAP || !BOOTSTRAP.estimate){
      current = null;
      items = [];
      positionsByCategory = {};
      positionsAll = [];
      categories = [];
      setHeader(null);
      setStatus('Error: Проект не найден.');
      disableUI(true);
      return;
    }

    current = BOOTSTRAP.estimate;
    positionsByCategory = BOOTSTRAP.positionsByCategory || {};
    positionsAll = arr(BOOTSTRAP.positions);
    categories = arr(BOOTSTRAP.categories);

    items = [];
    var src = arr(BOOTSTRAP.items);
    for(var i=0;i<src.length;i++){
      var x=src[i]||{};
      items.push({
        category: String(x.category || '').trim(),
        position: String(x.position || '').trim(),
        comment: String(x.comment || '').trim()
      });
    }
    if(!items.length) items.push(blankRow());

    renderItems();
    setHeader(current);
    setStatus('Готово');
    disableUI(false);
  }

  function init(){
    $('btnAddRow').addEventListener('click', function(){
      if(!current) return;
      items.push(blankRow());
      renderItems();
    });

    $('btnSave').addEventListener('click', function(){
      if(!current) return;
      setStatus('Сохранение…');

      var payload=[];
      for(var i=0;i<items.length;i++){
        var it=items[i]||{};
        payload.push({
          category:String(it.category||'').trim(),
          position:String(it.position||'').trim(),
          comment:String(it.comment||'').trim()
        });
      }

      google.script.run
        .withSuccessHandler(function(res){
          setStatus('Сохранено');
          if(res){
            current.itemsCount = res.itemsCount;
            setHeader(current);
          }
        })
        .withFailureHandler(function(e){
          setStatus(String(e&&e.message?e.message:e));
        })
        .saveEstimateItems(current.id, payload);
    });

    $('btnOpenSheet').addEventListener('click', function(){
      if(!current) return;
      setStatus('Выгружаю на лист…');
      google.script.run
        .withSuccessHandler(function(){ setStatus('Готово') })
        .withFailureHandler(function(e){ setStatus(String(e&&e.message?e.message:e)) })
        .exportEstimateToSheet(current.id);
    });

    $('btnBack').addEventListener('click', function(){
      setStatus('Открываю проекты…');
      google.script.run
        .withSuccessHandler(function(){ google.script.host.close(); })
        .withFailureHandler(function(e){ setStatus(String(e&&e.message?e.message:e)) })
        .openEstimateBuilder();
    });

    $('commentCancel').addEventListener('click', function(){
      closeCommentModal();
    });

    $('commentSave').addEventListener('click', function(){
      if(commentIdx === null) return;
      items[commentIdx].comment = $('commentInput').value.trim();
      closeCommentModal();
      renderItems();
    });

    $('commentOverlay').addEventListener('click', function(e){
      if(e.target === $('commentOverlay')) closeCommentModal();
    });

    hydrateFromBootstrap();
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
