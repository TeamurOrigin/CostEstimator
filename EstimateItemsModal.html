<!-- EstimateItemsModal.html — ЗАМЕНИ ВЕСЬ ФАЙЛ НА ЭТОТ -->

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{
      --bg:#070d18;
      --panel:rgba(15,23,42,.72);
      --panel2:rgba(2,6,23,.42);
      --text:#e7eefc;
      --muted:#95a6c7;
      --border:rgba(148,163,184,.16);
      --border2:rgba(148,163,184,.10);
      --accent:#38bdf8;
      --green:#34d399;
      --red:#ef4444;
      --shadow:0 18px 70px rgba(0,0,0,.55);
      --shadow2:0 10px 28px rgba(0,0,0,.35);
      --r:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:11.5px;
      line-height:1.2;
      color:var(--text);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
        radial-gradient(900px 420px at 88% 0%, rgba(52,211,153,.13), transparent 55%),
        radial-gradient(900px 520px at 50% 110%, rgba(99,102,241,.10), transparent 55%),
        linear-gradient(180deg, #060b16 0%, #040816 100%);
      overflow:hidden;
    }

    .wrap{
      height:100%;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .top{
      flex:0 0 auto;
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.82), rgba(15,23,42,.62));
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .top:before{
      content:"";
      position:absolute;inset:-2px;
      background:
        radial-gradient(600px 140px at 18% 0%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(600px 160px at 86% 0%, rgba(52,211,153,.14), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }
    .top > *{position:relative;z-index:1}
    .title{font-weight:950;font-size:14px;letter-spacing:.2px}
    .status{
      font-size:10.8px;color:var(--muted);
      padding:5px 9px;
      border:1px solid var(--border2);
      border-radius:999px;
      background:rgba(2,6,23,.40);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      white-space:nowrap;
      max-width:60%;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .card{
      flex:1 1 auto;
      min-height:0;
      border:1px solid var(--border);
      border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.76), rgba(2,6,23,.44));
      box-shadow:var(--shadow2);
      overflow:hidden;
      position:relative;
      display:flex;
      flex-direction:column;
    }
    .card:before{
      content:"";
      position:absolute;inset:0;
      background:
        radial-gradient(800px 220px at 22% 0%, rgba(56,189,248,.10), transparent 55%),
        radial-gradient(800px 220px at 82% 0%, rgba(52,211,153,.08), transparent 55%);
      pointer-events:none;
      opacity:.9;
    }
    .card > *{position:relative;z-index:1}

    .h{
      flex:0 0 auto;
      padding:10px 12px;
      border-bottom:1px solid var(--border2);
      font-weight:950;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:linear-gradient(180deg, rgba(2,6,23,.32), rgba(2,6,23,.12));
    }

    .hLeft{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    #curTitle{font-size:12.2px;font-weight:950}
    #curSub{color:rgba(149,166,199,.85);font-size:10.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}

    .tools{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .pill{
      font-size:10.6px;color:var(--muted);
      padding:5px 9px;
      border:1px solid var(--border2);
      border-radius:999px;
      background:rgba(2,6,23,.35);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      white-space:nowrap;
    }

    .b{
      flex:1 1 auto;
      min-height:0;
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .btn{
      height:32px;
      padding:0 12px;
      border-radius:12px;
      border:1px solid var(--border2);
      background:linear-gradient(180deg, rgba(2,6,23,.55), rgba(2,6,23,.35));
      color:var(--text);
      font-weight:950;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
      transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,filter .12s ease;
      white-space:nowrap;
    }
    .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .btn:active{transform:translateY(0)}
    .btn.acc{
      border-color:rgba(56,189,248,.45);
      box-shadow:0 0 0 3px rgba(56,189,248,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .btn.green{
      border-color:rgba(52,211,153,.45);
      box-shadow:0 0 0 3px rgba(52,211,153,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .btn.red{
      border-color:rgba(239,68,68,.45);
      box-shadow:0 0 0 3px rgba(239,68,68,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .xbtn{height:28px;border-radius:11px;font-weight:950;padding:0 10px}

    .rowTools{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex:0 0 auto;
    }

    .itemsWrap{
      flex:1 1 auto;
      min-height:0;
      border:1px solid var(--border2);
      border-radius:14px;
      overflow:auto;
      background:rgba(2,6,23,.18);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.1px}
    th,td{padding:6px 6px;border-bottom:1px solid rgba(148,163,184,.09);vertical-align:middle}
    th{
      color:rgba(149,166,199,.85);
      font-weight:950;
      text-align:center;
      background:rgba(2,6,23,.28);
      position:sticky;top:0;z-index:2;
      box-shadow:inset 0 -1px 0 rgba(148,163,184,.08);
      white-space:nowrap;
      font-size:10.3px;
      line-height:1.05;
    }

    table.items{table-layout:fixed}
    table.items input{
      width:100%;
      height:28px;
      padding:4px 8px;
      font-size:11px;
      border-radius:999px;
      text-align:center;
      border:1px solid rgba(148,163,184,.10);
      background:rgba(2,6,23,.46);
      color:var(--text);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
      outline:none;
    }
    table.items input:focus{
      border-color:rgba(56,189,248,.55);
      box-shadow:0 0 0 3px rgba(56,189,248,.10), inset 0 1px 0 rgba(255,255,255,.03);
    }
    .leftCell{ text-align:left; padding-left:10px }
    .leftCell input{ border-radius:12px; text-align:left; padding:4px 10px; }

    .col-article{width:230px;min-width:230px;max-width:230px}
    .col-num{width:62px;min-width:62px;max-width:62px}
    .col-sum{width:95px;min-width:95px;max-width:95px}
    .col-x{width:52px;min-width:52px;max-width:52px}

    .sum{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border:1px solid var(--border2);
      border-radius:14px;
      background:linear-gradient(180deg, rgba(2,6,23,.34), rgba(2,6,23,.22));
      font-weight:950;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }
    .sum .m{font-weight:950;color:rgba(149,166,199,.85);font-size:11px}

    .disabled{opacity:.55;pointer-events:none;filter:grayscale(.15)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Позиции сметы</div>
      <div class="status" id="status">Загрузка…</div>
    </div>

    <div class="card" id="itemsCard">
      <div class="h">
        <div class="hLeft">
          <div id="curTitle">Позиции</div>
          <div id="curSub">Загрузка данных…</div>
        </div>
        <div class="tools">
          <span class="pill" id="curMeta">—</span>
          <button class="btn" id="btnBack">К сметам</button>
          <button class="btn" id="btnOpenSheet">Выгрузить на лист</button>
        </div>
      </div>

      <div class="b">
        <datalist id="articleOptions"></datalist>

        <div class="rowTools">
          <button class="btn green" id="btnAddRow">Добавить позицию</button>
          <button class="btn acc" id="btnSave">Сохранить</button>
        </div>

        <div class="itemsWrap">
          <table class="items">
            <thead>
              <tr>
                <th class="col-article" style="text-align:left;padding-left:10px">Статья</th>
                <th class="col-num">Кол-во</th>
                <th class="col-num">Залов</th>
                <th class="col-num">Дней</th>
                <th class="col-num">Дней<br>мер.</th>
                <th class="col-num">Коэф.</th>
                <th class="col-num">Цена<br>ед.</th>
                <th class="col-sum">Сумма</th>
                <th class="col-x"></th>
              </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>

        <div class="sum">
          <div class="m">Итого</div>
          <div id="totalSum">0.00</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ВАЖНО: bootstrap приходит с сервера при открытии модалки (без второго запроса)
  var BOOTSTRAP = <?!= JSON.stringify(bootstrap || null) ?>;

  var current = null;
  var items = [];
  var articlesByCategory = {};

  function $(id){return document.getElementById(id)}
  function setStatus(t){$('status').textContent=t}
  function arr(a){return a&&a.length?a:[]}
  function money(n){var x=Number(n||0);return x.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function num(v,def){
    if(def===undefined)def=0;
    if(v===null||v===undefined||v==='')return def;
    var x=Number(String(v).replace(',','.'));
    return isFinite(x)?x:def;
  }
  function normalizeRowInput(raw){
    var qty=num(raw.qty,0);
    var halls=num(raw.halls,1);
    var days=num(raw.days,1);
    var eventDays=num(raw.eventDays,1);
    var coef=num(raw.coef,1);
    var unitCost=num(raw.unitCost,0);
    if((qty>0 || unitCost>0)){
      if(halls===0) halls=1;
      if(days===0) days=1;
      if(eventDays===0) eventDays=1;
      if(coef===0) coef=1;
    }
    return {
      article: String(raw.article||'').trim(),
      qty: qty,
      halls: halls,
      days: days,
      eventDays: eventDays,
      coef: coef,
      unitCost: unitCost,
      rowSum: 0
    };
  }
  function blankRow(){return{article:'',qty:0,halls:1,days:1,eventDays:1,coef:1,unitCost:0,rowSum:0}}

  function disableUI(flag){
    var card=$('itemsCard');
    if(flag) card.classList.add('disabled'); else card.classList.remove('disabled');
  }

  function setHeader(est){
    if(!est){
      $('curTitle').textContent='Позиции';
      $('curSub').textContent='Смета не найдена';
      $('curMeta').textContent='—';
      return;
    }
    var meta='Категория: '+(est.category||'');
    if(est.type) meta+=' • Тип: '+est.type;
    $('curTitle').textContent=est.name||'';
    $('curSub').textContent=meta;
    $('curMeta').textContent='Статей: '+String(est.itemsCount||0)+' • Сумма: '+money(est.totalSum||0);
  }

  function buildArticleDatalist(category){
    var dl=$('articleOptions'); dl.innerHTML='';
    var list=arr(articlesByCategory && articlesByCategory[category]);
    for(var i=0;i<list.length;i++){
      var o=document.createElement('option');
      o.value=list[i];
      dl.appendChild(o);
    }
  }

  function calcRow(it){
    return num(it.qty,0)*num(it.halls,1)*num(it.days,1)*num(it.eventDays,1)*num(it.coef,1)*num(it.unitCost,0);
  }

  function recalcTotal(){
    var total=0;
    for(var i=0;i<items.length;i++){
      items[i].rowSum = calcRow(items[i]);
      total += items[i].rowSum;
    }
    $('totalSum').textContent = money(total);
  }

  function renderItems(){
    var body=$('itemsBody'); body.innerHTML='';
    if(!current) return;

    for(var i=0;i<items.length;i++){
      (function(idx){
        var it=items[idx];
        var tr=document.createElement('tr');

        function makeTdInput(val, onInput, attrs, cls){
          var td=document.createElement('td');
          if(cls) td.className=cls;
          var inp=document.createElement('input');
          inp.value = (val===undefined||val===null) ? '' : String(val);
          if(attrs){ for(var k in attrs) inp.setAttribute(k, attrs[k]); }
          inp.addEventListener('input', onInput);
          td.appendChild(inp);
          return { td: td, inp: inp };
        }

        var aCell = makeTdInput(it.article, function(e){
          items[idx].article = e.target.value;
        }, { list:'articleOptions' }, 'leftCell');
        tr.appendChild(aCell.td);

        function bindNum(key, def, sumTd){
          return function(e){
            items[idx][key] = num(e.target.value, def);
            items[idx].rowSum = calcRow(items[idx]);
            sumTd.textContent = money(items[idx].rowSum);
            // total — быстро (n маленькое)
            var total=0;
            for(var k=0;k<items.length;k++){
              total += calcRow(items[k]);
            }
            $('totalSum').textContent = money(total);
          };
        }

        var tdQty = makeTdInput(it.qty, function(){}, null, null);
        var tdHalls = makeTdInput(it.halls, function(){}, null, null);
        var tdDays = makeTdInput(it.days, function(){}, null, null);
        var tdED = makeTdInput(it.eventDays, function(){}, null, null);
        var tdCoef = makeTdInput(it.coef, function(){}, null, null);
        var tdUC = makeTdInput(it.unitCost, function(){}, null, null);

        var tdSum=document.createElement('td');
        tdSum.style.fontWeight='950';
        tdSum.style.textAlign='right';
        tdSum.textContent = money(it.rowSum||0);

        tdQty.inp.addEventListener('input', bindNum('qty',0,tdSum));
        tdHalls.inp.addEventListener('input', bindNum('halls',1,tdSum));
        tdDays.inp.addEventListener('input', bindNum('days',1,tdSum));
        tdED.inp.addEventListener('input', bindNum('eventDays',1,tdSum));
        tdCoef.inp.addEventListener('input', bindNum('coef',1,tdSum));
        tdUC.inp.addEventListener('input', bindNum('unitCost',0,tdSum));

        tr.appendChild(tdQty.td);
        tr.appendChild(tdHalls.td);
        tr.appendChild(tdDays.td);
        tr.appendChild(tdED.td);
        tr.appendChild(tdCoef.td);
        tr.appendChild(tdUC.td);
        tr.appendChild(tdSum);

        var tdX=document.createElement('td');
        var bx=document.createElement('button');
        bx.className='btn red xbtn';
        bx.textContent='×';
        bx.addEventListener('click', function(){
          items.splice(idx,1);
          if(!items.length) items.push(blankRow());
          recalcTotal();
          renderItems();
        });
        tdX.appendChild(bx);
        tr.appendChild(tdX);

        body.appendChild(tr);
      })(i);
    }
  }

  function hydrateFromBootstrap(){
    if(!BOOTSTRAP || !BOOTSTRAP.estimate){
      current = null;
      items = [];
      articlesByCategory = {};
      setHeader(null);
      setStatus('Error: Смета не найдена.');
      disableUI(true);
      return;
    }

    current = BOOTSTRAP.estimate;
    articlesByCategory = BOOTSTRAP.articlesByCategory || {};

    items = [];
    var src = arr(BOOTSTRAP.items);
    for(var i=0;i<src.length;i++){
      var x=src[i]||{};
      items.push(normalizeRowInput(x));
    }
    if(!items.length) items.push(blankRow());

    buildArticleDatalist(current.category);
    recalcTotal();
    renderItems();
    setHeader(current);
    setStatus('Готово');
    disableUI(false);
  }

  function init(){
    $('btnAddRow').addEventListener('click', function(){
      if(!current) return;
      items.push(blankRow());
      recalcTotal();
      renderItems();
    });

    $('btnSave').addEventListener('click', function(){
      if(!current) return;
      setStatus('Сохранение…');

      var payload=[];
      for(var i=0;i<items.length;i++){
        var it=items[i]||{};
        payload.push({
          article:String(it.article||'').trim(),
          qty:num(it.qty,0),
          halls:num(it.halls,1),
          days:num(it.days,1),
          eventDays:num(it.eventDays,1),
          coef:num(it.coef,1),
          unitCost:num(it.unitCost,0)
        });
      }

      google.script.run
        .withSuccessHandler(function(res){
          setStatus('Сохранено');
          if(res){
            current.itemsCount = res.itemsCount;
            current.totalSum = res.totalSum;
            setHeader(current);
          }
        })
        .withFailureHandler(function(e){
          setStatus(String(e&&e.message?e.message:e));
        })
        .saveEstimateItems(current.id, payload);
    });

    $('btnOpenSheet').addEventListener('click', function(){
      if(!current) return;
      setStatus('Выгружаю на лист…');
      google.script.run
        .withSuccessHandler(function(){ setStatus('Готово') })
        .withFailureHandler(function(e){ setStatus(String(e&&e.message?e.message:e)) })
        .exportEstimateToSheet(current.id);
    });

    $('btnBack').addEventListener('click', function(){
      setStatus('Открываю сметы…');
      google.script.run
        .withSuccessHandler(function(){ google.script.host.close(); })
        .withFailureHandler(function(e){ setStatus(String(e&&e.message?e.message:e)) })
        .openEstimateBuilder();
    });

    hydrateFromBootstrap();
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
