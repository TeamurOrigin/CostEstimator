<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#4b5563;
      --border:#000000;
      --header:#3b3b3b;
      --headerText:#ffffff;
      --accent:#3cc4c8;
      --accentDark:#2aa7ab;
      --danger:#e63b3b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      font-size:12px;
      color:var(--text);
      background:var(--bg);
    }
    .wrap{
      height:100%;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      border:2px solid var(--border);
    }
    .topBar{
      display:flex;
      gap:6px;
      align-items:center;
    }
    .topBar .tab{
      background:var(--accent);
      color:#fff;
      font-weight:700;
      border:none;
      padding:4px 12px;
      height:22px;
      cursor:pointer;
    }
    .topBar .tab:active{transform:translateY(1px)}
    .sectionTitle{
      background:var(--header);
      color:var(--headerText);
      font-weight:700;
      padding:3px 8px;
      width:140px;
    }
    .metaRow{
      display:grid;
      grid-template-columns:220px 180px 180px 180px;
      gap:8px;
      margin:6px 0;
    }
    .metaBox{
      border:2px solid var(--border);
      padding:4px 6px;
      text-align:center;
    }
    .status{
      font-size:11px;
      color:var(--muted);
      margin-left:auto;
    }
    .rowTools{
      display:flex;
      gap:6px;
      margin-bottom:4px;
    }
    .btn{
      background:var(--accent);
      color:#fff;
      border:none;
      height:22px;
      font-weight:700;
      cursor:pointer;
      padding:0 10px;
    }
    .btn:active{transform:translateY(1px)}
    .btn.danger{background:var(--danger)}

    .tableWrap{
      border:2px solid var(--border);
      flex:1 1 auto;
      overflow:auto;
    }
    table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }
    th,td{
      border:2px solid var(--border);
      padding:4px 6px;
      text-align:center;
    }
    th{
      background:var(--header);
      color:var(--headerText);
      font-weight:700;
    }
    .cellSelect{
      width:100%;
      height:22px;
      border:1px solid var(--border);
      font-size:12px;
      padding:2px 4px;
      background:#fff;
    }
    .modalOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:20;
    }
    .modalOverlay.show{display:flex}
    .commentModal{
      width:420px;
      max-width:90vw;
      border:2px solid var(--border);
      background:#fff;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .commentModal h3{margin:0;font-size:13px}
    .commentModal textarea{
      min-height:100px;
      resize:vertical;
      border:1px solid var(--border);
      padding:6px;
      font-size:12px;
    }
    .commentModal .actions{
      display:flex;
      gap:6px;
      justify-content:flex-end;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topBar">
      <button class="tab" id="btnAddRow">Добавить позицию</button>
      <button class="tab" id="btnSave">Сохранить</button>
      <button class="tab" id="btnBack">К проектам</button>
      <button class="tab" id="btnOpenSheet">Выгрузить на лист</button>
      <div class="status" id="status">Загрузка…</div>
    </div>

    <div class="sectionTitle">Проекты</div>

    <div class="metaRow">
      <div class="metaBox" id="metaProject">—</div>
      <div class="metaBox" id="metaType">—</div>
      <div class="metaBox" id="metaGroup">—</div>
      <div class="metaBox" id="metaCategory">—</div>
    </div>

    <div class="tableWrap">
      <table>
        <colgroup>
          <col style="width:30%">
          <col style="width:35%">
          <col style="width:20%">
          <col style="width:15%">
        </colgroup>
        <thead>
          <tr>
            <th>Категория</th>
            <th>Позиция</th>
            <th>Комментарий</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="modalOverlay" id="commentOverlay">
    <div class="commentModal">
      <h3>Комментарий к позиции</h3>
      <div id="commentMeta">—</div>
      <textarea id="commentInput" placeholder="Введите комментарий"></textarea>
      <div class="actions">
        <button class="btn" id="commentCancel">Отмена</button>
        <button class="btn" id="commentSave">Сохранить</button>
      </div>
    </div>
  </div>

<script>
  var BOOTSTRAP = <?!= JSON.stringify(bootstrap || null) ?>;

  var current = null;
  var items = [];
  var positionsByCategory = {};
  var positionsAll = [];
  var categories = [];
  var commentIdx = null;

  function $(id){return document.getElementById(id)}
  function setStatus(t){$('status').textContent=t}
  function arr(a){return a&&a.length?a:[]}

  function blankRow(){return{category:'',position:'',comment:''}}

  function setHeader(est){
    if(!est){
      $('metaProject').textContent='—';
      $('metaType').textContent='—';
      $('metaGroup').textContent='—';
      $('metaCategory').textContent='—';
      return;
    }
    $('metaProject').textContent=est.name||'';
    $('metaType').textContent=est.type||'';
    $('metaGroup').textContent=est.group||'';
    $('metaCategory').textContent='Категория';
  }

  function fillSelect(select, list, currentValue){
    select.innerHTML='';
    var emptyOpt=document.createElement('option');
    emptyOpt.value='';
    emptyOpt.textContent='—';
    select.appendChild(emptyOpt);
    for(var i=0;i<list.length;i++){
      var o=document.createElement('option');
      o.value=list[i];
      o.textContent=list[i];
      select.appendChild(o);
    }
    select.value=currentValue || '';
  }

  function renderItems(){
    var body=$('itemsBody'); body.innerHTML='';
    if(!current) return;

    for(var i=0;i<items.length;i++){
      (function(idx){
        var it=items[idx];
        var tr=document.createElement('tr');

        var tdCat=document.createElement('td');
        var selCat=document.createElement('select');
        selCat.className='cellSelect';
        fillSelect(selCat, categories, it.category);
        selCat.addEventListener('change', function(){
          items[idx].category = selCat.value;
          if(items[idx].position){
            var allowed = arr(positionsByCategory[selCat.value]);
            if(selCat.value && allowed.indexOf(items[idx].position) === -1){
              items[idx].position = '';
            }
          }
          renderItems();
        });
        tdCat.appendChild(selCat);

        var tdPos=document.createElement('td');
        var selPos=document.createElement('select');
        selPos.className='cellSelect';
        var list = selCat.value ? arr(positionsByCategory[selCat.value]) : positionsAll;
        fillSelect(selPos, list, it.position);
        selPos.addEventListener('change', function(){
          items[idx].position = selPos.value;
        });
        tdPos.appendChild(selPos);

        var tdCom=document.createElement('td');
        var btn=document.createElement('button');
        btn.className='btn';
        btn.textContent=it.comment ? 'Изменить' : 'Добавить';
        btn.addEventListener('click', function(){
          openCommentModal(idx);
        });
        tdCom.appendChild(btn);

        var tdX=document.createElement('td');
        var bx=document.createElement('button');
        bx.className='btn danger';
        bx.textContent='Удалить';
        bx.addEventListener('click', function(){
          items.splice(idx,1);
          if(!items.length) items.push(blankRow());
          renderItems();
        });
        tdX.appendChild(bx);

        tr.appendChild(tdCat);
        tr.appendChild(tdPos);
        tr.appendChild(tdCom);
        tr.appendChild(tdX);
        body.appendChild(tr);
      })(i);
    }
  }

  function openCommentModal(idx){
    commentIdx = idx;
    var it = items[idx] || {};
    $('commentMeta').textContent = (it.category||'Без категории') + ' • ' + (it.position||'Без позиции');
    $('commentInput').value = it.comment || '';
    $('commentOverlay').classList.add('show');
  }

  function closeCommentModal(){
    $('commentOverlay').classList.remove('show');
    commentIdx = null;
  }

  function hydrateFromBootstrap(){
    if(!BOOTSTRAP || !BOOTSTRAP.estimate){
      current = null;
      items = [];
      positionsByCategory = {};
      positionsAll = [];
      categories = [];
      setHeader(null);
      setStatus('Error: Проект не найден.');
      return;
    }

    current = BOOTSTRAP.estimate;
    positionsByCategory = BOOTSTRAP.positionsByCategory || {};
    positionsAll = arr(BOOTSTRAP.positions);
    categories = arr(BOOTSTRAP.categories);

    items = [];
    var src = arr(BOOTSTRAP.items);
    for(var i=0;i<src.length;i++){
      var x=src[i]||{};
      items.push({
        category: String(x.category || '').trim(),
        position: String(x.position || '').trim(),
        comment: String(x.comment || '').trim()
      });
    }
    if(!items.length) items.push(blankRow());

    renderItems();
    setHeader(current);
    setStatus('Готово');
  }

  function init(){
    $('btnAddRow').addEventListener('click', function(){
      if(!current) return;
      items.push(blankRow());
      renderItems();
    });

    $('btnSave').addEventListener('click', function(){
      if(!current) return;
      setStatus('Сохранение…');

      var payload=[];
      for(var i=0;i<items.length;i++){
        var it=items[i]||{};
        payload.push({
          category:String(it.category||'').trim(),
          position:String(it.position||'').trim(),
          comment:String(it.comment||'').trim()
        });
      }

      google.script.run
        .withSuccessHandler(function(res){
          setStatus('Сохранено');
          if(res){
            current.itemsCount = res.itemsCount;
          }
        })
        .withFailureHandler(function(e){
          setStatus(String(e&&e.message?e.message:e));
        })
        .saveEstimateItems(current.id, payload);
    });

    $('btnOpenSheet').addEventListener('click', function(){
      if(!current) return;
      setStatus('Выгружаю на лист…');
      google.script.run
        .withSuccessHandler(function(){ setStatus('Готово') })
        .withFailureHandler(function(e){ setStatus(String(e&&e.message?e.message:e)) })
        .exportEstimateToSheet(current.id);
    });

    $('btnBack').addEventListener('click', function(){
      setStatus('Открываю проекты…');
      google.script.run
        .withSuccessHandler(function(){ google.script.host.close(); })
        .withFailureHandler(function(e){ setStatus(String(e&&e.message?e.message:e)) })
        .openEstimateBuilder();
    });

    $('commentCancel').addEventListener('click', function(){
      closeCommentModal();
    });

    $('commentSave').addEventListener('click', function(){
      if(commentIdx === null) return;
      items[commentIdx].comment = $('commentInput').value.trim();
      closeCommentModal();
      renderItems();
    });

    $('commentOverlay').addEventListener('click', function(e){
      if(e.target === $('commentOverlay')) closeCommentModal();
    });

    hydrateFromBootstrap();
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
