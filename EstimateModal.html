<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{--bg:#070d18;--panel:rgba(15,23,42,.72);--panel2:rgba(2,6,23,.42);--text:#e7eefc;--muted:#95a6c7;--border:rgba(148,163,184,.16);--border2:rgba(148,163,184,.10);--accent:#38bdf8;--green:#34d399;--red:#ef4444;--shadow:0 18px 70px rgba(0,0,0,.55);--shadow2:0 10px 28px rgba(0,0,0,.35);--r:16px;--r2:12px}
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:12px;line-height:1.25;color:var(--text);
      background:radial-gradient(900px 420px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
                 radial-gradient(900px 420px at 88% 0%, rgba(52,211,153,.13), transparent 55%),
                 radial-gradient(900px 520px at 50% 110%, rgba(99,102,241,.10), transparent 55%),
                 linear-gradient(180deg,#060b16 0%,#040816 100%)}

    .wrap{padding:14px}
    .top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.82), rgba(15,23,42,.62));box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
    .top:before{content:"";position:absolute;inset:-2px;background:radial-gradient(600px 140px at 18% 0%, rgba(56,189,248,.18), transparent 60%),
                                              radial-gradient(600px 160px at 86% 0%, rgba(52,211,153,.14), transparent 60%);pointer-events:none;opacity:.9}
    .top>*{position:relative;z-index:1}
    .title{font-weight:950;font-size:15px;letter-spacing:.2px}
    .status{font-size:11px;color:var(--muted);padding:6px 10px;border:1px solid var(--border2);border-radius:999px;background:rgba(2,6,23,.40);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);white-space:nowrap}

    /* ✅ ЛЕВЫЙ БЛОК СУЖЕН */
    .split{display:grid;grid-template-columns:minmax(420px,520px) 1fr;gap:12px}

    .card{border:1px solid var(--border);border-radius:var(--r);background:linear-gradient(180deg, rgba(15,23,42,.76), rgba(2,6,23,.44));box-shadow:var(--shadow2);overflow:hidden;position:relative;min-height:610px}
    .card:before{content:"";position:absolute;inset:0;background:radial-gradient(800px 220px at 22% 0%, rgba(56,189,248,.10), transparent 55%),
                                              radial-gradient(800px 220px at 82% 0%, rgba(52,211,153,.08), transparent 55%);pointer-events:none;opacity:.9}
    .card>*{position:relative;z-index:1}

    .h{padding:12px 14px;border-bottom:1px solid var(--border2);font-weight:950;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg, rgba(2,6,23,.32), rgba(2,6,23,.12))}
    .b{padding:12px 14px}
    .tools{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .pill{font-size:11px;color:var(--muted);padding:6px 10px;border:1px solid var(--border2);border-radius:999px;background:rgba(2,6,23,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);white-space:nowrap}

    label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px}
    input,select,textarea{width:100%;border-radius:12px;border:1px solid var(--border2);background:rgba(2,6,23,.44);color:var(--text);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:box-shadow .12s ease,border-color .12s ease,background .12s ease}
    input,select{height:34px;padding:8px 10px}
    input::placeholder{color:rgba(149,166,199,.55)}
    input:focus,select:focus,textarea:focus{border-color:rgba(56,189,248,.55);box-shadow:0 0 0 3px rgba(56,189,248,.12), inset 0 1px 0 rgba(255,255,255,.04);background:rgba(2,6,23,.50)}

    .btn{height:34px;padding:0 12px;border-radius:12px;border:1px solid var(--border2);background:linear-gradient(180deg, rgba(2,6,23,.55), rgba(2,6,23,.35));color:var(--text);font-weight:950;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:transform .12s ease,filter .12s ease;white-space:nowrap}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:translateY(0)}
    .btn.acc{border-color:rgba(56,189,248,.45);box-shadow:0 0 0 3px rgba(56,189,248,.08), inset 0 1px 0 rgba(255,255,255,.05)}
    .btn.green{border-color:rgba(52,211,153,.45);box-shadow:0 0 0 3px rgba(52,211,153,.08), inset 0 1px 0 rgba(255,255,255,.05)}
    .btn.red{border-color:rgba(239,68,68,.45);box-shadow:0 0 0 3px rgba(239,68,68,.08), inset 0 1px 0 rgba(255,255,255,.05)}
    .mini{height:30px;border-radius:11px}

    .gridL{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:12px}
    .gridR{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:12px}

    .tableShell{border:1px solid var(--border2);border-radius:14px;overflow:auto;max-height:520px;background:rgba(2,6,23,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.25px}
    th,td{padding:8px 8px;border-bottom:1px solid rgba(148,163,184,.09);vertical-align:middle}
    th{color:rgba(149,166,199,.85);font-weight:950;text-align:left;background:rgba(2,6,23,.28);position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 rgba(148,163,184,.08)}
    tbody tr:hover td{background:rgba(56,189,248,.05)}
    tr.sel td{background:rgba(56,189,248,.09)}
    td.num{text-align:right}
    td.center{text-align:center}

    /* ✅ КНОПКИ ДУБЛ/УДАЛ ГОРИЗОНТАЛЬНО */
    .actions{display:flex;gap:8px;justify-content:flex-end;align-items:center}
    .actions .btn{width:auto;min-width:72px}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Конструктор сметы</div>
      <div class="status" id="status">Загрузка…</div>
    </div>

    <div class="split">
      <!-- ЛЕВЫЙ БЛОК: Проекты -->
      <div class="card">
        <div class="h">
          <div>Проекты</div>
          <div class="tools">
            <span class="pill" id="pMeta">—</span>
            <button class="btn mini" id="btnRefresh">Обновить</button>
          </div>
        </div>

        <div class="b">
          <div class="gridL">
            <div>
              <label>Наименование проекта</label>
              <input id="newProjectName" placeholder="Например: Энергетики">
            </div>
            <button class="btn acc" id="btnCreateProject">Новая смета</button>
          </div>

          <div class="tableShell">
            <table>
              <thead>
                <tr>
                  <th style="width:54%">Проект</th>
                  <th style="width:16%">Позиции</th>
                  <th style="width:18%">Сумма</th>
                  <th style="width:12%">Действия</th>
                </tr>
              </thead>
              <tbody id="projectsBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ПРАВЫЙ БЛОК: Смета (Записи) -->
      <div class="card">
        <div class="h">
          <div id="entriesTitle">Смета</div>
          <div class="tools">
            <span class="pill" id="eMeta">—</span>
          </div>
        </div>

        <div class="b">
          <div class="gridR">
            <div>
              <label>Тип</label>
              <select id="newType"></select>
            </div>
            <div>
              <label>Группа</label>
              <input id="newGroup" placeholder="Например: Трансляция">
            </div>
            <div>
              <label>Категория</label>
              <select id="newCategory"></select>
            </div>
            <button class="btn green" id="btnCreateEntry">Новая запись</button>
          </div>

          <div class="tableShell">
            <table>
              <thead>
                <tr>
                  <th style="width:22%">Тип</th>
                  <th style="width:20%">Группа</th>
                  <th style="width:24%">Категория</th>
                  <th style="width:12%">Позиции</th>
                  <th style="width:14%">Сумма</th>
                  <th style="width:8%">Действия</th>
                </tr>
              </thead>
              <tbody id="entriesBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  var boot=null;
  var selectedProjectId='';
  var selectedProject=null;
  var entries=[];

  function $(id){return document.getElementById(id)}
  function setStatus(t){$('status').textContent=t}
  function arr(a){return a&&a.length?a:[]}
  function money(n){var x=Number(n||0);return x.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})}

  function fillSelect(sel, list){
    sel.innerHTML='';
    for(var i=0;i<list.length;i++){
      var o=document.createElement('option');
      o.value=list[i];o.textContent=list[i];
      sel.appendChild(o);
    }
  }

  function renderProjects(){
    var list = arr(boot && boot.projects);
    $('pMeta').textContent = 'Проектов: ' + list.length;

    var body = $('projectsBody');
    body.innerHTML='';

    if(!list.length){
      var tr=document.createElement('tr');
      var td=document.createElement('td');td.colSpan=4;td.style.color='rgba(149,166,199,.85)';td.style.padding='12px 10px';
      td.textContent='Проектов пока нет';
      tr.appendChild(td);body.appendChild(tr);
      return;
    }

    for(var i=0;i<list.length;i++){
      (function(p){
        var tr=document.createElement('tr');
        if(String(p.id)===String(selectedProjectId)) tr.className='sel';

        tr.addEventListener('click', function(){
          selectProject(p.id);
        });

        var td1=document.createElement('td');td1.textContent=p.name||'';
        var td2=document.createElement('td');td2.className='center';td2.textContent=String(Number(p.itemsCount||0));
        var td3=document.createElement('td');td3.className='num';td3.textContent=money(p.totalSum||0);

        var td4=document.createElement('td');

        // ✅ горизонтально
        var box=document.createElement('div');box.className='actions';

        var bDup=document.createElement('button');
        bDup.className='btn mini green';
        bDup.textContent='Дубл.';
        bDup.addEventListener('click', function(e){ e.stopPropagation(); duplicateProject(p.id); });

        var bDel=document.createElement('button');
        bDel.className='btn mini red';
        bDel.textContent='Удал.';
        bDel.addEventListener('click', function(e){ e.stopPropagation(); deleteProject(p.id); });

        box.appendChild(bDup);
        box.appendChild(bDel);
        td4.appendChild(box);

        tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);
        body.appendChild(tr);
      })(list[i]);
    }
  }

  function renderEntries(){
    var body=$('entriesBody');
    body.innerHTML='';

    if(!selectedProject){
      $('entriesTitle').textContent='Смета';
      $('eMeta').textContent='Выберите проект слева';
      var tr=document.createElement('tr');
      var td=document.createElement('td');td.colSpan=6;td.style.color='rgba(149,166,199,.85)';td.style.padding='12px 10px';
      td.textContent='Сначала выберите проект';
      tr.appendChild(td);body.appendChild(tr);
      return;
    }

    $('entriesTitle').textContent='Смета • ' + (selectedProject.name||'');
    $('eMeta').textContent='Записей: ' + entries.length;

    if(!entries.length){
      var tr0=document.createElement('tr');
      var td0=document.createElement('td');td0.colSpan=6;td0.style.color='rgba(149,166,199,.85)';td0.style.padding='12px 10px';
      td0.textContent='Записей сметы пока нет (нажмите "Новая запись")';
      tr0.appendChild(td0);body.appendChild(tr0);
      return;
    }

    for(var i=0;i<entries.length;i++){
      (function(e){
        var tr=document.createElement('tr');

        var td1=document.createElement('td');td1.textContent=e.type||'';
        var td2=document.createElement('td');td2.textContent=e.group||'';
        var td3=document.createElement('td');td3.textContent=e.category||'';
        var td4=document.createElement('td');td4.className='center';td4.textContent=String(Number(e.itemsCount||0));
        var td5=document.createElement('td');td5.className='num';td5.textContent=money(e.totalSum||0);

        var td6=document.createElement('td');
        var box=document.createElement('div');box.className='actions';

        var bEdit=document.createElement('button');
        bEdit.className='btn mini acc';
        bEdit.textContent='Ред.';
        bEdit.addEventListener('click', function(){
          var entryId = e.id || e.entryId;
          if (!entryId) { setStatus('Запись сметы не найдена.'); return; }
          setStatus('Открываю…');
          google.script.run
            .withSuccessHandler(function(){ google.script.host.close(); })
            .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
            .openEntryItems(entryId);
        });

        var bDup=document.createElement('button');
        bDup.className='btn mini green';
        bDup.textContent='Дубл.';
        bDup.addEventListener('click', function(){
          var entryId = e.id || e.entryId;
          if (!entryId) { setStatus('Запись сметы не найдена.'); return; }
          duplicateEntry(entryId);
        });

        var bDel=document.createElement('button');
        bDel.className='btn mini red';
        bDel.textContent='Удал.';
        bDel.addEventListener('click', function(){
          var entryId = e.id || e.entryId;
          if (!entryId) { setStatus('Запись сметы не найдена.'); return; }
          deleteEntry(entryId);
        });

        box.appendChild(bEdit);
        box.appendChild(bDup);
        box.appendChild(bDel);
        td6.appendChild(box);

        tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);tr.appendChild(td5);tr.appendChild(td6);
        body.appendChild(tr);
      })(entries[i]);
    }
  }

  function refreshAll(cb){
    setStatus('Загрузка…');
    google.script.run
      .withSuccessHandler(function(data){
        boot=data;

        fillSelect($('newType'), arr(boot.types));
        fillSelect($('newCategory'), arr(boot.categories));

        renderProjects();

        if(selectedProjectId){
          selectProject(selectedProjectId, cb);
        } else {
          selectedProject=null;
          entries=[];
          renderEntries();
          setStatus('Готово');
          if(cb) cb();
        }
      })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .getBootstrapData();
  }

  function selectProject(id, cb){
    selectedProjectId=String(id||'');
    var list=arr(boot && boot.projects);
    selectedProject=null;
    for(var i=0;i<list.length;i++){
      if(String(list[i].id)===selectedProjectId){ selectedProject=list[i]; break; }
    }
    renderProjects();

    setStatus('Загрузка сметы…');
    google.script.run
      .withSuccessHandler(function(res){
        selectedProject=res.project;
        entries=arr(res.entries);
        renderEntries();
        setStatus('Готово');
        if(cb) cb();
      })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .getProjectEntries(selectedProjectId);
  }

  function createProject(){
    var name=$('newProjectName').value.trim();
    if(!name){ setStatus('Укажите наименование проекта'); return; }
    setStatus('Создание проекта…');
    google.script.run
      .withSuccessHandler(function(p){
        $('newProjectName').value='';
        refreshAll(function(){ selectProject(p.id); });
      })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .createProject({name:name});
  }

  function deleteProject(id){
    setStatus('Удаление проекта…');
    google.script.run
      .withSuccessHandler(function(){
        if(String(id)===String(selectedProjectId)){ selectedProjectId=''; selectedProject=null; entries=[]; }
        refreshAll();
      })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .deleteProject(id);
  }

  function duplicateProject(id){
    setStatus('Дублирование проекта…');
    google.script.run
      .withSuccessHandler(function(){ refreshAll(); })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .duplicateProject(id);
  }

  function createEntry(){
    if(!selectedProjectId){ setStatus('Сначала выберите проект'); return; }
    var type=$('newType').value.trim();
    var group=$('newGroup').value.trim();
    var category=$('newCategory').value.trim();
    if(!type){ setStatus('Укажите тип'); return; }
    if(!category){ setStatus('Укажите категорию'); return; }

    setStatus('Создание записи…');
    google.script.run
      .withSuccessHandler(function(){
        $('newGroup').value='';
        selectProject(selectedProjectId);
      })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .createEntry(selectedProjectId, {type:type, group:group, category:category});
  }

  function deleteEntry(entryId){
    setStatus('Удаление записи…');
    google.script.run
      .withSuccessHandler(function(){ selectProject(selectedProjectId); })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .deleteEntry(entryId);
  }

  function duplicateEntry(entryId){
    setStatus('Дублирование записи…');
    google.script.run
      .withSuccessHandler(function(){ selectProject(selectedProjectId); })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .duplicateEntry(entryId);
  }

  function init(){
    $('btnRefresh').addEventListener('click', function(){ refreshAll(); });
    $('btnCreateProject').addEventListener('click', createProject);
    $('btnCreateEntry').addEventListener('click', createEntry);
    refreshAll();
  }
  window.addEventListener('load', init);
</script>
</body>
</html>
