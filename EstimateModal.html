<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#4b5563;
      --border:#000000;
      --header:#3b3b3b;
      --headerText:#ffffff;
      --accent:#3cc4c8;
      --accentDark:#2aa7ab;
      --danger:#e63b3b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      font-size:12px;
      color:var(--text);
      background:var(--bg);
    }
    .wrap{
      height:100%;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      border:2px solid var(--border);
    }
    .topBar{
      display:flex;
      gap:6px;
    }
    .topBar .tab{
      background:var(--accent);
      color:#fff;
      font-weight:700;
      border:none;
      padding:4px 12px;
      height:22px;
      cursor:pointer;
    }
    .topBar .tab:active{transform:translateY(1px)}
    .sectionTitle{
      background:var(--header);
      color:var(--headerText);
      font-weight:700;
      padding:3px 8px;
      width:120px;
    }
    .formRow{
      display:grid;
      grid-template-columns:220px 170px 170px 120px;
      gap:8px;
      align-items:end;
      margin-top:6px;
    }
    label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
    input,select{
      width:100%;
      height:24px;
      border:2px solid var(--border);
      padding:2px 6px;
      font-size:12px;
    }
    .btn{
      background:var(--accent);
      color:#fff;
      border:none;
      height:24px;
      font-weight:700;
      cursor:pointer;
    }
    .btn:active{transform:translateY(1px)}
    .status{
      font-size:11px;
      color:var(--muted);
      margin-left:auto;
      align-self:center;
    }
    .tableWrap{
      margin-top:8px;
      border:2px solid var(--border);
    }
    table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }
    th,td{
      border:2px solid var(--border);
      padding:4px 6px;
      text-align:center;
    }
    th{
      background:var(--header);
      color:var(--headerText);
      font-weight:700;
    }
    td.left{text-align:left}
    .actions{
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .actions .btn{height:22px}
    .btn.danger{background:var(--danger)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topBar">
      <button class="tab">Новый проект</button>
      <button class="tab">Сохранить</button>
      <button class="tab">Импорт</button>
      <button class="tab">Экспорт</button>
      <div class="status" id="status">Загрузка…</div>
    </div>

    <div class="sectionTitle">Проекты</div>

    <div class="formRow">
      <div>
        <label>Наименование проекта</label>
        <input id="newName" placeholder="Например: Энергетики">
      </div>
      <div>
        <label>Тип</label>
        <select id="newType"></select>
      </div>
      <div>
        <label>Группа</label>
        <input id="newGroup" placeholder="Например: Трансляция">
      </div>
      <button class="btn" id="btnCreate">Создать</button>
    </div>

    <div class="tableWrap">
      <table>
        <colgroup>
          <col style="width:35%">
          <col style="width:18%">
          <col style="width:20%">
          <col style="width:12%">
          <col style="width:15%">
        </colgroup>
        <thead>
          <tr>
            <th>Наименование проекта</th>
            <th>Тип</th>
            <th>Группа</th>
            <th>Кол-во позиций</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="estBody"></tbody>
      </table>
    </div>
  </div>

<script>
  var boot=null;
  function $(id){return document.getElementById(id)}
  function setStatus(t){$('status').textContent=t}
  function arr(a){return a&&a.length?a:[]}

  function fillTypes(){
    var sel=$('newType'); sel.innerHTML='';
    var types=arr(boot&&boot.types);
    for(var i=0;i<types.length;i++){
      var o=document.createElement('option');
      o.value=types[i]; o.textContent=types[i];
      sel.appendChild(o);
    }
  }

  function renderEstimates(){
    var body=$('estBody'); body.innerHTML='';
    var list=arr(boot&&boot.estimates);

    if(!list.length){
      var tr=document.createElement('tr');
      var td=document.createElement('td');
      td.colSpan=5;
      td.style.padding='8px 6px';
      td.style.color='var(--muted)';
      td.textContent='Проектов пока нет';
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }

    for(var i=0;i<list.length;i++){
      var e=list[i];
      var tr=document.createElement('tr');

      var td1=document.createElement('td');
      td1.className='left';
      td1.textContent=e.name||'';

      var td2=document.createElement('td');
      td2.textContent=e.type||'';

      var td3=document.createElement('td');
      td3.textContent=e.group||'';

      var td4=document.createElement('td');
      td4.textContent=String(Number(e.itemsCount||0));

      var td5=document.createElement('td');
      var box=document.createElement('div');
      box.className='actions';

      var bOpen=document.createElement('button');
      bOpen.className='btn';
      bOpen.textContent='Редактировать';
      bOpen.dataset.id=e.id;
      bOpen.addEventListener('click',function(ev){
        openEstimate(ev.currentTarget.dataset.id);
      });

      var bDel=document.createElement('button');
      bDel.className='btn danger';
      bDel.textContent='Удалить';
      bDel.dataset.id=e.id;
      bDel.addEventListener('click',function(ev){
        delEstimate(ev.currentTarget.dataset.id);
      });

      box.appendChild(bOpen);
      box.appendChild(bDel);
      td5.appendChild(box);

      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);
      tr.appendChild(td4);
      tr.appendChild(td5);
      body.appendChild(tr);
    }
  }

  function refreshBootstrap(cb){
    google.script.run
      .withSuccessHandler(function(data){
        boot=data;
        fillTypes();
        renderEstimates();
        if(cb)cb();
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .getBootstrapData();
  }

  function openEstimate(id){
    setStatus('Открываю проект…');
    google.script.run
      .withSuccessHandler(function(){
        google.script.host.close();
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .openEstimateItems(id);
  }

  function delEstimate(id){
    setStatus('Удаление…');
    google.script.run
      .withSuccessHandler(function(){
        setStatus('Готово');
        refreshBootstrap();
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .deleteEstimate(id);
  }

  function init(){
    $('btnCreate').addEventListener('click',function(){
      var name=$('newName').value.trim();
      var type=$('newType').value.trim();
      var group=$('newGroup').value.trim();
      if(!name){setStatus('Укажите название');return}
      if(!type){setStatus('Укажите тип');return}
      if(!group){setStatus('Укажите группу');return}
      setStatus('Создание…');
      google.script.run
        .withSuccessHandler(function(est){
          $('newName').value='';
          $('newGroup').value='';
          setStatus('Готово');
          refreshBootstrap(function(){ openEstimate(est.id); });
        })
        .withFailureHandler(function(e){
          setStatus(String(e&&e.message?e.message:e));
        })
        .createEstimate({name:name,type:type,group:group});
    });

    setStatus('Загрузка…');
    google.script.run
      .withSuccessHandler(function(data){
        boot=data;
        fillTypes();
        renderEstimates();
        setStatus('Готово');
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .getBootstrapData();
  }

  window.addEventListener('load',init);
</script>
</body>
</html>
