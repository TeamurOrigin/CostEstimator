<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{
      --bg:#070d18;
      --panel:rgba(15,23,42,.72);
      --panel2:rgba(2,6,23,.42);
      --text:#e7eefc;
      --muted:#95a6c7;
      --border:rgba(148,163,184,.16);
      --border2:rgba(148,163,184,.10);
      --accent:#38bdf8;
      --green:#34d399;
      --red:#ef4444;
      --shadow:0 18px 70px rgba(0,0,0,.55);
      --shadow2:0 10px 28px rgba(0,0,0,.35);
      --r:16px;
      --r2:12px;
      --dd-bg: rgba(15, 23, 42, 0.18);
      --dd-border: rgba(148, 163, 184, 0.22);
    }
    *{box-sizing:border-box}html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:12px;line-height:1.25;color:var(--text);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
        radial-gradient(900px 420px at 88% 0%, rgba(52,211,153,.13), transparent 55%),
        radial-gradient(900px 520px at 50% 110%, rgba(99,102,241,.10), transparent 55%),
        linear-gradient(180deg,#060b16 0%,#040816 100%)
    }

    .wrap{padding:14px}
    .top{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.82), rgba(15,23,42,.62));
      box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden
    }
    .top:before{
      content:"";position:absolute;inset:-2px;
      background:
        radial-gradient(600px 140px at 18% 0%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(600px 160px at 86% 0%, rgba(52,211,153,.14), transparent 60%);
      pointer-events:none;opacity:.9
    }
    .top>*{position:relative;z-index:1}
    .title{font-weight:950;font-size:15px;letter-spacing:.2px}
    .status{
      font-size:11px;color:var(--muted);padding:6px 10px;
      border:1px solid var(--border2);border-radius:999px;background:rgba(2,6,23,.40);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);white-space:nowrap
    }
    .topLeft{display:flex;align-items:center;gap:12px;min-width:0}
    .topActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .exportFolderInput{
      width:290px;
      max-width:38vw;
      height:30px;
      padding:0 10px;
      border-radius:11px;
      border:1px solid var(--border2);
      background:rgba(2,6,23,.45);
      color:var(--text);
      font-size:11px;
      text-align:center;
    }

    .split{display:grid;grid-template-columns:minmax(420px,520px) 1fr;gap:12px}

    .card{
      border:1px solid var(--border);border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.76), rgba(2,6,23,.44));
      box-shadow:var(--shadow2);overflow:hidden;position:relative;min-height:610px
    }
    .card:before{
      content:"";position:absolute;inset:0;
      background:
        radial-gradient(800px 220px at 22% 0%, rgba(56,189,248,.10), transparent 55%),
        radial-gradient(800px 220px at 82% 0%, rgba(52,211,153,.08), transparent 55%);
      pointer-events:none;opacity:.9
    }
    .card>*{position:relative;z-index:1}

    .h{
      padding:12px 14px;border-bottom:1px solid var(--border2);
      font-weight:950;display:flex;align-items:center;justify-content:space-between;gap:10px;
      background:linear-gradient(180deg, rgba(2,6,23,.32), rgba(2,6,23,.12))
    }
    .b{padding:12px 14px}
    .tools{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .pill{
      font-size:11px;color:var(--muted);padding:6px 10px;
      border:1px solid var(--border2);border-radius:999px;background:rgba(2,6,23,.35);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);white-space:nowrap
    }

    label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px}
    input,select,textarea{
      width:100%;border-radius:12px;border:1px solid var(--border2);
      background:rgba(2,6,23,.44);color:var(--text);outline:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
      transition:box-shadow .12s ease,border-color .12s ease,background .12s ease
    }
    input,select{height:34px;padding:8px 10px}
    input::placeholder{color:rgba(149,166,199,.55)}
    input:focus,select:focus,textarea:focus{
      border-color:rgba(56,189,248,.55);
      box-shadow:0 0 0 3px rgba(56,189,248,.12), inset 0 1px 0 rgba(255,255,255,.04);
      background:rgba(2,6,23,.50)
    }

    .btn{
      --pulse: rgba(56,189,248,.18);
      height:34px;padding:0 12px;border-radius:12px;border:1px solid var(--border2);
      background:linear-gradient(180deg, rgba(2,6,23,.55), rgba(2,6,23,.35));
      color:var(--text);font-weight:950;cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
      transition:transform .12s ease,filter .12s ease;
      white-space:nowrap;position:relative
    }
    .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .btn:active{transform:translateY(0)}
    .btn.acc{
      --pulse: rgba(56,189,248,.22);
      border-color:rgba(56,189,248,.45);
      box-shadow:0 0 0 3px rgba(56,189,248,.08), inset 0 1px 0 rgba(255,255,255,.05)
    }
    .btn.green{
      --pulse: rgba(52,211,153,.22);
      border-color:rgba(52,211,153,.45);
      box-shadow:0 0 0 3px rgba(52,211,153,.08), inset 0 1px 0 rgba(255,255,255,.05)
    }
    .btn.red{
      --pulse: rgba(239,68,68,.22);
      border-color:rgba(239,68,68,.45);
      box-shadow:0 0 0 3px rgba(239,68,68,.08), inset 0 1px 0 rgba(255,255,255,.05)
    }
    .mini{height:30px;border-radius:11px}

    @keyframes btnPulse{
      0%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 0 rgba(0,0,0,0); filter:brightness(1.02); }
      50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 5px var(--pulse); filter:brightness(1.08); }
      100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 0 rgba(0,0,0,0); filter:brightness(1.02); }
    }
    .btn.busy{animation:btnPulse .95s ease-in-out infinite; pointer-events:none; opacity:.98}
    .btn:disabled{cursor:default}

    .gridL{display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:end;margin-bottom:12px}
    .gridImport{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:12px}
    .hidden{display:none!important}
    .gridR{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:12px}

    .tableShell{
      border:1px solid var(--border2);border-radius:14px;overflow:auto;max-height:520px;
      background:rgba(2,6,23,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)
    }
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.25px}
    th,td{padding:8px 8px;border-bottom:1px solid rgba(148,163,184,.09);vertical-align:middle}
    th{
      color:rgba(149,166,199,.85);font-weight:950;text-align:left;background:rgba(2,6,23,.28);
      position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 rgba(148,163,184,.08)
    }
    th.th-center{text-align:center}
    th.th-right{text-align:right}
    tbody tr:hover td{background:rgba(56,189,248,.05)}
    tr.sel td{background:rgba(56,189,248,.09)}
    td.num{text-align:right}
    td.center{text-align:center}
    .actions{display:flex;gap:8px;justify-content:flex-end;align-items:center}
    .actions .btn{width:auto;min-width:72px}

    .dlgOverlay{
      position:fixed;inset:0;z-index:9999;
      background:rgba(0,0,0,.58);
      display:flex;align-items:center;justify-content:center;
      padding:14px
    }
    .dlgOverlay.hidden{display:none}
    .dlg{
      width:min(560px, calc(100vw - 28px));
      border:1px solid var(--border);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(15,23,42,.90), rgba(2,6,23,.72));
      box-shadow:var(--shadow);
      position:relative;overflow:hidden
    }
    .dlg:before{
      content:"";position:absolute;inset:-2px;
      background:
        radial-gradient(700px 160px at 20% 0%, rgba(56,189,248,.14), transparent 60%),
        radial-gradient(700px 180px at 82% 0%, rgba(52,211,153,.10), transparent 60%);
      pointer-events:none;opacity:.95
    }
    .dlg>*{position:relative;z-index:1}
    .dlgH{padding:12px 14px;border-bottom:1px solid var(--border2);font-weight:950}
    .dlgB{padding:12px 14px;color:rgba(231,238,252,.92);line-height:1.35}
    .dlgActions{padding:12px 14px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

    .previewOverlay{
      position:fixed;inset:0;z-index:10000;
      background:rgba(0,0,0,.68);
      display:flex;align-items:center;justify-content:center;
      padding:14px;
    }
    .previewOverlay.hidden{display:none}
    .previewModal{
      width:min(1180px, calc(100vw - 28px));
      max-height:calc(100vh - 28px);
      border:1px solid var(--border);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(15,23,42,.97), rgba(2,6,23,.92));
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;flex-direction:column;
    }
    .previewH{
      padding:12px 14px;border-bottom:1px solid var(--border2);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      font-weight:950;
    }
    .previewTitle{font-size:14px}
    .previewMeta{font-size:11px;color:var(--muted)}
    .previewB{padding:12px 14px;overflow:auto}
    .previewTypeRow td,
    .previewGroupRow td,
    .previewCategoryRow td,
    .previewGrandRow td{
      font-weight:950;
      color:rgba(149,166,199,.94);
      background:rgba(2,6,23,.48);
    }
    .previewTypeRow td{background:rgba(56,189,248,.14);color:#dbeafe}
    .previewGroupRow td{background:rgba(99,102,241,.10)}
    .previewCategoryRow td{background:rgba(52,211,153,.10)}
    .previewGrandRow td{background:rgba(56,189,248,.18);color:#e0f2fe}

    .pvTreeCell{padding:0}
    .pvLabel{display:flex;align-items:center;gap:8px;padding:7px 10px;min-height:30px}
    .pvToggle{
      width:14px;height:14px;flex:0 0 14px;
      border-radius:3px;
      border:1px solid rgba(148,163,184,.24);
      background:rgba(2,6,23,.45);
      color:rgba(231,238,252,.92);
      font-size:12px;line-height:12px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04)
    }
    .pvToggle:hover{
      border-color:rgba(56,189,248,.55);
      box-shadow:0 0 0 3px rgba(56,189,248,.10), inset 0 1px 0 rgba(255,255,255,.04)
    }
    .pvToggle.empty{opacity:0;pointer-events:none}
    .pvText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.previewTotals{
      margin-top:10px;
      border:1px solid var(--border2);
      border-radius:12px;
      overflow:hidden;
      background:rgba(2,6,23,.26);
    }
    .previewTotals table td{
      font-weight:950;
      border-bottom:1px solid rgba(148,163,184,.11);
    }
    .previewTotals table tr:last-child td{border-bottom:none}
    .previewActions{
      padding:12px 14px;
      border-top:1px solid var(--border2);
      display:flex;justify-content:flex-end;
    }

    .type-dd-btn{
      width:100%;
      height:34px;
      border:1px solid var(--dd-border);
      border-radius:12px;
      padding:6px 30px 6px 10px;
      font-size:12px;
      font-weight:950;
      letter-spacing:0;
      cursor:pointer;
      text-align:left;
      background-color:rgba(2,6,23,.44);
      color:var(--text);
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23e2e8f0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat:no-repeat;
      background-position:right 10px center;
      background-size:14px 14px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 10px 20px rgba(0,0,0,0.18);
      transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .type-dd-btn:hover{
      transform:translateY(-1px);
      border-color:rgba(56, 189, 248, 0.55);
      filter:brightness(1.03);
    }
    .type-dd-btn:focus-visible{
      outline:none;
      border-color:rgba(56, 189, 248, 0.75);
      box-shadow:
        0 0 0 2px rgba(56, 189, 248, 0.18),
        0 16px 26px rgba(0,0,0,0.30);
    }

    .type-dd-panel{
      position:fixed;
      z-index:9998;
      background:var(--dd-bg);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border:1px solid var(--dd-border);
      border-radius:12px;
      box-shadow:0 18px 40px rgba(0,0,0,0.45);
      padding:4px;
      max-height:280px;
      overflow:auto;
    }


    .type-dd-search-wrap{
      position:sticky;
      top:0;
      z-index:2;
      padding:4px;
      background:linear-gradient(180deg, rgba(15,23,42,.94), rgba(15,23,42,.78));
      border-bottom:1px solid rgba(148,163,184,.12);
      margin:-4px -4px 4px;
      border-radius:12px 12px 0 0;
    }
    .type-dd-search{
      width:100%;
      height:30px;
      padding:6px 8px;
      border-radius:9px;
      border:1px solid rgba(148,163,184,.28);
      background:rgba(2,6,23,.55);
      color:var(--text);
      font-size:12px;
      font-weight:700;
    }
    .type-dd-empty{
      padding:8px;
      color:var(--muted);
      font-size:11px;
    }
    .type-dd-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:6px 8px;
      border-radius:10px;
      cursor:pointer;
      user-select:none;
      font-size:12px;
      font-weight:950;
      letter-spacing:0;
      transition:background .12s ease, transform .12s ease;
    }
    .type-dd-item:hover{
      background:rgba(56, 189, 248, 0.14);
      transform:translateX(1px);
    }
    .type-dd-item.is-active{
      background:rgba(148, 163, 184, 0.16);
    }
    .type-dd-check{
      font-size:12px;
      font-weight:950;
      opacity:0.9;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="topLeft">
        <div class="title">Конструктор сметы</div>
        <div class="topActions">
          <button class="btn mini" id="btnPreview" disabled>Предпросмотр</button>
          <button class="btn mini" id="btnExportCurrent" disabled>Экспорт</button>
          <button class="btn mini acc" id="btnExportSheet" disabled>Экспорт в таблицу</button>
          <button class="btn mini green" id="btnExportPdf" disabled>Экспорт в PDF</button>
          <input class="exportFolderInput" id="exportFolderId" placeholder="ID папки Google Drive для экспорта (необязательно)">
        </div>
      </div>
      <div class="status" id="status">Загрузка…</div>
    </div>

    <div class="split">
      <div class="card">
        <div class="h">
          <div>Проекты</div>
          <div class="tools">
            <span class="pill" id="pMeta">—</span>
            <button class="btn mini" id="btnRefresh">Обновить</button>
          </div>
        </div>

        <div class="b">
          <div class="gridL">
            <div>
              <label>Режим проекта</label>
              <div id="projectModeMount"></div>
            </div>

            <div>
              <label>Тариф</label>
              <div id="newProjectTariffMount"></div>
            </div>

            <button class="btn acc" id="btnCreateProject">Новая смета</button>
          </div>

          <div class="gridImport hidden" id="existingProjectSelectors">
            <div>
              <label>Клиент</label>
              <div id="existingClientMount"></div>
            </div>
            <div>
              <label>Проект</label>
              <div id="existingProjectMount"></div>
            </div>
            <div>
              <label>Дата</label>
              <div id="existingDateMount"></div>
            </div>
          </div>

          <div style="margin-bottom:10px">
            <label>Клиент</label>
            <input id="newClientName" list="clientsSuggestions" placeholder="Выберите или введите клиента">
            <datalist id="clientsSuggestions"></datalist>
          </div>

          <div style="margin-bottom:12px">
            <label>Наименование проекта</label>
            <input id="newProjectName" placeholder="Например: Энергетики">
          </div>

          <div class="tableShell">
            <table>
              <thead>
                <tr>
                  <th style="width:54%">Проект</th>
                  <th class="th-center" style="width:16%">Позиции</th>
                  <th class="th-right" style="width:18%">Сумма</th>
                  <th class="th-center" style="width:12%">Действия</th>
                </tr>
              </thead>
              <tbody id="projectsBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="h">
          <div id="entriesTitle">Смета</div>
          <div class="tools">
            <span class="pill" id="eMeta">—</span>
          </div>
        </div>

        <div class="b">
          <div class="gridR">
            <div>
              <label>Тип</label>
              <div id="newTypeMount"></div>
            </div>
            <div>
              <label>Группа</label>
              <input id="newGroup" placeholder="Например: Трансляция">
            </div>
            <div>
              <label>Категория</label>
              <div id="newCategoryMount"></div>
            </div>
            <button class="btn green" id="btnCreateEntry">Новая запись</button>
          </div>

          <div class="tableShell">
            <table>
              <thead>
                <tr>
                  <th style="width:22%">Тип</th>
                  <th style="width:20%">Группа</th>
                  <th style="width:24%">Категория</th>
                  <th class="th-center" style="width:12%">Позиции</th>
                  <th class="th-right" style="width:14%">Сумма</th>
                  <th class="th-center" style="width:8%">Действия</th>
                </tr>
              </thead>
              <tbody id="entriesBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="dlgOverlay" class="dlgOverlay hidden" aria-hidden="true">
    <div class="dlg" role="dialog" aria-modal="true">
      <div class="dlgH" id="dlgTitle">Подтверждение</div>
      <div class="dlgB" id="dlgText">—</div>
      <div class="dlgActions">
        <button class="btn red" id="dlgOk">Удалить</button>
        <button class="btn" id="dlgCancel">Отмена</button>
      </div>
    </div>
  </div>

  <div id="previewOverlay" class="previewOverlay hidden" aria-hidden="true">
    <div class="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="previewH">
        <div>
          <div class="previewTitle" id="previewTitle">Предпросмотр проекта</div>
          <div class="previewMeta" id="previewMeta">—</div>
        </div>
        <button class="btn mini" id="btnClosePreviewTop">Закрыть</button>
      </div>

      <div class="previewB">
        <div class="tableShell" style="max-height:52vh">
          <table>
            <thead>
              <tr>
                <th style="width:52%;text-align:left;padding-left:10px">Наименование</th>
                <th class="th-right" style="width:8%">Кол-во</th>
                <th class="th-right" style="width:8%">Залов</th>
                <th class="th-right" style="width:8%">Дней</th>
                <th class="th-right" style="width:8%">Коэф.</th>
                <th class="th-right" style="width:8%">Цена</th>
                <th class="th-right" style="width:8%">Сумма</th>
              </tr>
            </thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>

        <div class="previewTotals">
          <table>
            <tbody id="previewTotalsBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

<script>
  var boot=null;
  var selectedProjectId='';
  var selectedProject=null;
  var entries=[];
  var PROJECT_TARIFFS=['Фиксированный','Тарифный','Обычный','Процентный'];
  var PROJECT_MODES=['Новый клиент','Текущий клиент'];
  var projectModeDD=null;
  var tariffDD=null;
  var typeDD=null;
  var categoryDD=null;
  var existingClientDD=null;
  var existingProjectDD=null;
  var existingDateDD=null;
  var clientsDbRows=[];

  function $(id){return document.getElementById(id)}
  function setStatus(t){$('status').textContent=t}
  function getExportFolderId(){
    var el=$('exportFolderId');
    return String(el && el.value ? el.value : '').trim();
  }
  function saveExportFolderId(btn){
    var id=getExportFolderId();
    callGs(btn,'Сохранение папки экспорта…','setExportFolderId',[id],function(res){
      var saved=String(res && res.folderId ? res.folderId : '');
      setStatus(saved ? 'ID папки экспорта сохранён' : 'ID папки экспорта очищен');
    });
  }
  function updateExportButtons(){
    var disabled = !selectedProjectId;
    var btnPreview=$('btnPreview');
    var btnCurrent=$('btnExportCurrent');
    var btnSheet=$('btnExportSheet');

  function renderPreviewData(res){
    var body=$('previewBody');
    var totalsBody=$('previewTotalsBody');
    body.innerHTML='';
    totalsBody.innerHTML='';

    previewExpanded = {};

    var project = res && res.project ? res.project : {};
    var rows = arr(res && res.rows);
    $('previewMeta').textContent = (project.client || '—') + ' • ' + (project.name || '—') + (project.tariff ? (' • ' + project.tariff) : '');

    function makeAgg_(){ return { qty:0,halls:0,days:0,coef:0,coefSum:0,coefCount:0,unitCost:0,sum:0,items:0 }; }
    function addAgg_(a,b){
      a.qty += Number(b.qty||0);
      a.halls += Number(b.halls||0);
      a.days = Math.max(Number(a.days||0), Number(b.days||0));
      a.coefSum += Number(b.coefSum!=null ? b.coefSum : (b.coef||0));
      a.coefCount += Number(b.coefCount!=null ? b.coefCount : (b.items||0));
      a.coef = a.coefCount ? (a.coefSum / a.coefCount) : 0;
      a.unitCost += Number(b.unitCost||0);
      a.sum += Number(b.sum||0);
      a.items += Number(b.items||0);
    }
    function node_(id, kind, label, level){
      return { id:id, kind:kind, label:label, level:level, children:[], totals:makeAgg_() };
    }
    function isExpanded_(id){ return previewExpanded[id] !== false; }
    function toggle_(id){
      previewExpanded[id] = !isExpanded_(id);
      draw_();
    }

    function sortNode_(n){
      if(!n || !n.children) return;
      n.children.sort(function(a,b){ return String(a.label||'').localeCompare(String(b.label||''),'ru'); });
      for(var k=0;k<n.children.length;k++) sortNode_(n.children[k]);
    }

    function buildTree_(){
      var root = node_('root','root','',-1);
      var typeMap = {};
      var groupMap = {};
      var catMap = {};

      for(var i=0;i<rows.length;i++){
        var r = rows[i] || {};
        var t = String(r.type||'').trim() || '—';
        var g = String(r.group||'').trim() || '—';
        var c = String(r.category||'').trim() || '—';

        var tid = 't|' + t;
        var gid = 'g|' + t + '|' + g;
        var cid = 'c|' + t + '|' + g + '|' + c;

        var tNode = typeMap[tid];
        if(!tNode){
          tNode = node_(tid,'type',t,0);
          typeMap[tid]=tNode;
          root.children.push(tNode);
        }

        var gNode = groupMap[gid];
        if(!gNode){
          gNode = node_(gid,'group',g,1);
          groupMap[gid]=gNode;
          tNode.children.push(gNode);
        }

        var cNode = catMap[cid];
        if(!cNode){
          cNode = node_(cid,'category',c,2);
          catMap[cid]=cNode;
          gNode.children.push(cNode);
        }

        var itemAgg = {
          qty:Number(r.qty||0),
          halls:Number(r.halls||0),
          days:Number(r.days||0),
          coef:Number(r.coef||0),
          coefSum:Number(r.coef||0),
          coefCount:1,
          unitCost:Number(r.unitCost||0),
          sum:Number(r.lineTotal||0),
          items:1
        };

        var itNode = node_('i|' + cid + '|' + i,'item',String(r.position||'').trim() || '—',3);
        itNode.totals = itemAgg;
        cNode.children.push(itNode);

        addAgg_(cNode.totals, itemAgg);
        addAgg_(gNode.totals, itemAgg);
        addAgg_(tNode.totals, itemAgg);
        addAgg_(root.totals, itemAgg);
      }

      sortNode_(root);
      return root;
    }

    function addTotalRow(label, val){
      var tr=document.createElement('tr');
      var td1=document.createElement('td');
      var td2=document.createElement('td');
      td1.style.width='72%';
      td2.className='num';
      td1.textContent=label;
      td2.textContent=val;
      tr.appendChild(td1);
      tr.appendChild(td2);
      totalsBody.appendChild(tr);
    }

    function draw_(){
      body.innerHTML='';
      totalsBody.innerHTML='';

      if(!rows.length){
        var tr0=document.createElement('tr');
        var td0=document.createElement('td');
        td0.colSpan=7;
        td0.style.color='rgba(149,166,199,.85)';
        td0.style.padding='12px 10px';
        td0.textContent='В проекте пока нет данных для предпросмотра';
        tr0.appendChild(td0);
        body.appendChild(tr0);
        return;
      }

      var root = buildTree_();

      function drawRow_(n, cls, labelOverride){
        var tr=document.createElement('tr');
        if(cls) tr.className=cls;

        var td0=document.createElement('td');
        td0.className='pvTreeCell';

        var lbl=document.createElement('div');
        lbl.className='pvLabel';
        lbl.style.paddingLeft = String(10 + (n.level>0 ? n.level*18 : 0)) + 'px';

        var hasChildren = n.children && n.children.length;
        var tg=document.createElement('span');
        tg.className='pvToggle' + (hasChildren ? '' : ' empty');
        tg.textContent = hasChildren ? (isExpanded_(n.id) ? '−' : '+') : '';
        if(hasChildren){
          tg.addEventListener('click', function(e){ e.stopPropagation(); toggle_(n.id); });
          lbl.addEventListener('click', function(){ toggle_(n.id); });
        }

        var tx=document.createElement('span');
        tx.className='pvText';
        tx.textContent = labelOverride != null ? labelOverride : String(n.label||'');

        lbl.appendChild(tg);
        lbl.appendChild(tx);
        td0.appendChild(lbl);
        tr.appendChild(td0);

        var t=n.totals||makeAgg_();
        var vals=[t.qty,t.halls,t.days,t.coef,t.unitCost,t.sum];

        for(var i=0;i<vals.length;i++){
          var td=document.createElement('td');
          td.className='num';
          if(i>=4) td.textContent = money0(vals[i]||0);
          else td.textContent = numberFmt(vals[i]||0);
          tr.appendChild(td);
        }

        body.appendChild(tr);
      }

      function walk_(n){
        for(var i=0;i<n.children.length;i++){
          var ch=n.children[i];
          var cls = ch.kind==='type' ? 'previewTypeRow' : (ch.kind==='group' ? 'previewGroupRow' : (ch.kind==='category' ? 'previewCategoryRow' : ''));
          drawRow_(ch, cls);
          if(ch.children && ch.children.length && isExpanded_(ch.id)) walk_(ch);
        }
      }

      walk_(root);

      var grand = root.totals || makeAgg_();
      var grandNode = node_('grand','grand','',0);
      grandNode.totals = grand;
      drawRow_(grandNode,'previewGrandRow','Общий итог');

      addTotalRow('Итого позиций', numberFmt(grand.items||0));
      addTotalRow('Сумма Кол-во', numberFmt(grand.qty||0));
      addTotalRow('Сумма Залов', numberFmt(grand.halls||0));
      addTotalRow('Макс. Дней', numberFmt(grand.days||0));
      addTotalRow('Средний Коэф.', numberFmt(grand.coef||0));
      addTotalRow('Сумма Цены', money0(grand.unitCost||0));
      addTotalRow('Итоговая сумма', money0(grand.sum||0));
    }

    draw_();
  }

  var activeDropdownCloser=null;

  function createDropdown(options, initial, onSelect, cfg){
    cfg = cfg || {};
    var searchable = !!cfg.searchable;
    var searchPlaceholder = cfg.searchPlaceholder || 'Поиск…';
    var value = (initial!=null ? String(initial) : (options && options[0] ? String(options[0]) : ''));
    var btn = document.createElement('button');
    btn.type='button';
    btn.className='type-dd-btn';
    btn.textContent = value || '—';

    function closeActive(){
      if(activeDropdownCloser){ activeDropdownCloser(); }
    }

    function openPanel(){
      closeActive();

      var panel = document.createElement('div');
      panel.className='type-dd-panel';

      var searchInput = null;
      var itemsBox = panel;
      var optionsList = Array.isArray(options) ? options.slice() : [];

      function setPanelPosition(){
        var rect = btn.getBoundingClientRect();
        panel.style.left = Math.round(rect.left) + 'px';
        panel.style.top = Math.round(rect.bottom + 6) + 'px';
        panel.style.width = Math.round(rect.width) + 'px';
      }

      function scrollSelectedIntoView(){
        var active = panel.querySelector('.type-dd-item.is-active');
        if(active){
          active.scrollIntoView({block:'nearest'});
        }
      }

      function renderList(filterText){
        var text = String(filterText || '').trim().toLowerCase();
        itemsBox.innerHTML='';
        var hasItems = false;

        for(var i=0;i<optionsList.length;i++){
          var opt = String(optionsList[i] || '');
          if(text && opt.toLowerCase().indexOf(text)===-1) continue;
          hasItems = true;

          (function(rawOpt){
            var item=document.createElement('div');
            item.className='type-dd-item' + (String(rawOpt)===String(value) ? ' is-active' : '');
            item.tabIndex=0;

            var label=document.createElement('span');
            label.textContent=String(rawOpt);

            var right=document.createElement('span');
            right.className='type-dd-check';
            right.textContent=(String(rawOpt)===String(value)) ? '✓' : '';

            item.appendChild(label);
            item.appendChild(right);

            item.addEventListener('click', function(){
              setValue(rawOpt);
              if(onSelect) onSelect(String(rawOpt));
              closePanel();
            });

            itemsBox.appendChild(item);
          })(opt);
        }

        if(!hasItems){
          var empty = document.createElement('div');
          empty.className='type-dd-empty';
          empty.textContent='Ничего не найдено';
          itemsBox.appendChild(empty);
        }
      }

      if(searchable){
        var searchWrap = document.createElement('div');
        searchWrap.className='type-dd-search-wrap';
        searchInput = document.createElement('input');
        searchInput.type='text';
        searchInput.className='type-dd-search';
        searchInput.placeholder=searchPlaceholder;
        searchWrap.appendChild(searchInput);
        panel.appendChild(searchWrap);

        itemsBox = document.createElement('div');
        panel.appendChild(itemsBox);

        searchInput.addEventListener('input', function(){
          renderList(searchInput.value);
        });
      }

      renderList('');
      document.body.appendChild(panel);
      setPanelPosition();
      scrollSelectedIntoView();

      var onDocDown = function(e){
        if(e.target===btn) return;
        if(panel.contains(e.target)) return;
        closePanel();
      };

      var onKeyDown = function(e){
        if(e.key==='Escape'){
          closePanel();
        }
      };

      var onResizeOrScroll = function(){
        if(!panel || !panel.parentNode) return;
        setPanelPosition();
      };

      function closePanel(){
        document.removeEventListener('mousedown', onDocDown, true);
        document.removeEventListener('keydown', onKeyDown, true);
        window.removeEventListener('resize', onResizeOrScroll, true);
        window.removeEventListener('scroll', onResizeOrScroll, true);
        if(panel && panel.parentNode) panel.parentNode.removeChild(panel);
        activeDropdownCloser=null;
      }

      document.addEventListener('mousedown', onDocDown, true);
      document.addEventListener('keydown', onKeyDown, true);
      window.addEventListener('resize', onResizeOrScroll, true);
      window.addEventListener('scroll', onResizeOrScroll, true);

      if(searchInput){
        setTimeout(function(){ searchInput.focus(); searchInput.select(); }, 0);
      }

      activeDropdownCloser = closePanel;
    }

    function setValue(v){
      value = String(v||'');
      btn.textContent = value || '—';
    }

    function getValue(){ return value; }

    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      openPanel();
    });

    setValue(value);
    return { btn: btn, getValue: getValue, setValue: setValue };
  }

    updateExportButtons();

    if(!entries.length){
      var tr0=document.createElement('tr');
      var td0=document.createElement('td');td0.colSpan=6;td0.style.color='rgba(149,166,199,.85)';td0.style.padding='12px 10px';
      td0.textContent='Записей сметы пока нет (нажмите "Новая запись")';
      tr0.appendChild(td0);body.appendChild(tr0);
      return;
    }

    for(var i=0;i<entries.length;i++){
      (function(e){
        var tr=document.createElement('tr');

        var td1=document.createElement('td');td1.textContent=e.type||'';
        var td2=document.createElement('td');td2.textContent=e.group||'';
        var td3=document.createElement('td');td3.textContent=e.category||'';
        var td4=document.createElement('td');td4.className='center';td4.textContent=String(Number(e.itemsCount||0));
        var td5=document.createElement('td');td5.className='num';td5.textContent=money(e.totalSum||0);

        var td6=document.createElement('td');
        var box=document.createElement('div');box.className='actions';

        var bEdit=document.createElement('button');
        bEdit.className='btn mini acc';
        bEdit.textContent='Ред.';
        bEdit.addEventListener('click', function(){
          callGs(bEdit,'Открываю…','openEntryItems',[e.id],function(){ google.script.host.close(); });
        });

        var bDup=document.createElement('button');
        bDup.className='btn mini green';
        bDup.textContent='Дубл.';
        bDup.addEventListener('click', function(){ duplicateEntry(e.id, bDup); });

        var bDel=document.createElement('button');
        bDel.className='btn mini red';
        bDel.textContent='Удал.';
        bDel.addEventListener('click', function(){
          confirmDialog({
            title:'Удалить запись?',
            text:'Запись "' + (e.type||'') + ' • ' + (e.group||'') + ' • ' + (e.category||'') + '" будет удалена вместе со всеми позициями. Это действие нельзя отменить.',
            okText:'Удалить',
            cancelText:'Отмена',
            okClass:'red'
          }).then(function(ok){
            if(!ok) return;
            deleteEntry(e.id, bDel);
          });
        });

        box.appendChild(bEdit);
        box.appendChild(bDup);
        box.appendChild(bDel);
        td6.appendChild(box);

        tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);tr.appendChild(td5);tr.appendChild(td6);
        body.appendChild(tr);
      })(entries[i]);
    }
  }

  function refreshAll(btn, cb){
    callGs(btn,'Загрузка…','getBootstrapData',[],function(data){
      boot=data;

      var exportFolderEl=$('exportFolderId');
      if(exportFolderEl) exportFolderEl.value=String(boot && boot.exportFolderId ? boot.exportFolderId : '');

      initEntryDropdowns(arr(boot.types), arr(boot.categories));
      refreshClientSuggestions();
      refreshExistingClientDropdowns();

      renderProjects();

      if(selectedProjectId){
        selectProject(selectedProjectId, cb);
      } else {
        selectedProjectId='';
        selectedProject=null;
        entries=[];
        renderEntries();
        setStatus('Готово');
        if(cb) cb();
      }
    });
  }

  function selectProject(id, cb){
    selectedProjectId=String(id||'');
    updateExportButtons();
    var list=arr(boot && boot.projects);
    selectedProject=null;
    for(var i=0;i<list.length;i++){
      if(String(list[i].id)===selectedProjectId){ selectedProject=list[i]; break; }
    }
    renderProjects();

    setStatus('Загрузка сметы…');
    google.script.run
      .withSuccessHandler(function(res){
        selectedProject=res.project;
        entries=arr(res.entries);
        renderEntries();
        setStatus('Готово');
        if(cb) cb();
      })
      .withFailureHandler(function(err){ setStatus(String(err&&err.message?err.message:err)); })
      .getProjectEntries(selectedProjectId);
  }

  function createProject(btn){
    var mode=(projectModeDD && projectModeDD.getValue ? projectModeDD.getValue() : 'Новый клиент');
    var name=$('newProjectName').value.trim();
    var clientName=$('newClientName').value.trim();
    var tariff=(tariffDD && tariffDD.getValue ? tariffDD.getValue().trim() : '');

    if(mode==='Текущий клиент'){
      var client=(existingClientDD && existingClientDD.getValue ? existingClientDD.getValue().trim() : '');
      clientName = client;
      var project=(existingProjectDD && existingProjectDD.getValue ? existingProjectDD.getValue().trim() : '');
      var date=(existingDateDD && existingDateDD.getValue ? existingDateDD.getValue().trim() : '');
      if(!client || client==='—'){ setStatus('Укажите клиента'); return; }
      if(!project || project==='—'){ setStatus('Укажите проект'); return; }
      if(!date || date==='—'){ setStatus('Укажите дату'); return; }
      if(!name){ setStatus('Укажите наименование проекта'); return; }
      if(!tariff){ setStatus('Укажите тариф'); return; }

      callGs(btn,'Импорт проекта…','importExistingProject',[{name:name, tariff:tariff, client:client, project:project, date:date}],function(p){
        $('newProjectName').value='';
        $('newClientName').value='';
        if(tariffDD && tariffDD.setValue) tariffDD.setValue('Обычный');
        refreshAll(null,function(){ selectProject(p.id); });
      });
      return;
    }

    if(!clientName){ setStatus('Укажите клиента'); return; }
    if(!name){ setStatus('Укажите наименование проекта'); return; }
    if(!tariff){ setStatus('Укажите тариф'); return; }

    callGs(btn,'Создание проекта…','createProject',[{name:name, client:clientName, tariff:tariff}],function(p){
      $('newProjectName').value='';
      $('newClientName').value='';
      if(tariffDD && tariffDD.setValue) tariffDD.setValue('Обычный');
      refreshAll(null,function(){ selectProject(p.id); });
    });
  }


  function exportProjectToSheet(btn){
    if(!selectedProjectId){ setStatus('Сначала выберите проект'); return; }
    callGs(btn,'Создание таблицы…','exportProjectToSpreadsheet',[selectedProjectId, getExportFolderId()],function(res){
      var title = String(res && res.spreadsheetName ? res.spreadsheetName : '');
      var url = String(res && res.spreadsheetUrl ? res.spreadsheetUrl : '');
      setStatus('Таблица создана: ' + title + ' • строк: ' + String(Number(res && res.rows || 0)));
      if(url) window.open(url, '_blank', 'noopener');
    });
  }

  function exportProjectToCurrentSheet(btn){
    if(!selectedProjectId){ setStatus('Сначала выберите проект'); return; }
    callGs(btn,'Экспорт в текущую таблицу…','exportProjectToClientSheet',[selectedProjectId],function(res){
      var sheetName = String(res && res.sheetName ? res.sheetName : 'Лист');
      setStatus('Экспорт выполнен: ' + sheetName + ' • строк: ' + String(Number(res && res.rows || 0)));
    });
  }


  function exportProjectToPdf(btn){
    if(!selectedProjectId){ setStatus('Сначала выберите проект'); return; }
    callGs(btn,'Формирование PDF…','exportProjectToPdf',[selectedProjectId, getExportFolderId()],function(res){
      var url = String(res && res.downloadUrl ? res.downloadUrl : '');
      var title = String(res && res.fileName ? res.fileName : 'PDF');
      if(!url){ setStatus('Не удалось получить ссылку на PDF'); return; }
      setStatus('PDF готов: ' + title);
      var link=document.createElement('a');
      link.href=url;
      link.target='_blank';
      link.rel='noopener';
      link.download=title;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  }

  function openProjectPreview(btn){
    if(!selectedProjectId){ setStatus('Сначала выберите проект'); return; }
    callGs(btn,'Подготовка предпросмотра…','getProjectPreviewData',[selectedProjectId],function(res){
      renderPreviewData(res||{});
      showPreviewModal();
      setStatus('Предпросмотр готов');
    });
  }

  function deleteProject(id, btn){
    callGs(btn,'Удаление проекта…','deleteProject',[id],function(){
      if(String(id)===String(selectedProjectId)){ selectedProjectId=''; selectedProject=null; entries=[]; }
      updateExportButtons();
      refreshAll(null);
    });
  }

  function duplicateProject(id, btn){
    callGs(btn,'Дублирование проекта…','duplicateProject',[id],function(){ refreshAll(null); });
  }

  function createEntry(btn){
    if(!selectedProjectId){ setStatus('Сначала выберите проект'); return; }
    var type=(typeDD && typeDD.getValue ? typeDD.getValue().trim() : '');
    var group=$('newGroup').value.trim();
    var category=(categoryDD && categoryDD.getValue ? categoryDD.getValue().trim() : '');
    if(!type){ setStatus('Укажите тип'); return; }
    if(!category){ setStatus('Укажите категорию'); return; }

    callGs(btn,'Создание записи…','createEntry',[selectedProjectId,{type:type, group:group, category:category}],function(){
      $('newGroup').value='';
      selectProject(selectedProjectId);
    });
  }

  function deleteEntry(entryId, btn){
    callGs(btn,'Удаление записи…','deleteEntry',[entryId],function(){ selectProject(selectedProjectId); });
  }

  function duplicateEntry(entryId, btn){
    callGs(btn,'Дублирование записи…','duplicateEntry',[entryId],function(){ selectProject(selectedProjectId); });
  }

  function init(){
    initTariffDropdown();
    initProjectModeDropdown();
    refreshClientSuggestions();
    syncClientInputWithMode();

    $('btnRefresh').addEventListener('click', function(e){ refreshAll(e.currentTarget); });
    $('btnCreateProject').addEventListener('click', function(e){ createProject(e.currentTarget); });
    $('btnCreateEntry').addEventListener('click', function(e){ createEntry(e.currentTarget); });
    $('btnPreview').addEventListener('click', function(e){ openProjectPreview(e.currentTarget); });
    $('btnExportCurrent').addEventListener('click', function(e){ exportProjectToCurrentSheet(e.currentTarget); });
    $('btnExportSheet').addEventListener('click', function(e){ exportProjectToSheet(e.currentTarget); });
    $('btnExportPdf').addEventListener('click', function(e){ exportProjectToPdf(e.currentTarget); });
    var exportFolderEl=$('exportFolderId');
    if(exportFolderEl){
      exportFolderEl.addEventListener('blur', function(e){ saveExportFolderId(e.currentTarget); });
      exportFolderEl.addEventListener('keydown', function(e){
        if(e.key==='Enter'){
          e.preventDefault();
          saveExportFolderId(e.currentTarget);
        }
      });
    }

    $('dlgOk').addEventListener('click', function(){ closeDialog(true); });
    $('dlgCancel').addEventListener('click', function(){ closeDialog(false); });
    var _btnClosePreview=$('btnClosePreview');
    if(_btnClosePreview) _btnClosePreview.addEventListener('click', closePreviewModal);
    $('btnClosePreviewTop').addEventListener('click', closePreviewModal);
    $('previewOverlay').addEventListener('click', function(e){
      if(e.target===this) closePreviewModal();
    });
    window.addEventListener('keydown', function(e){
      if(e.key==='Escape' && !$('dlgOverlay').classList.contains('hidden')) closeDialog(false);
      if(e.key==='Escape' && !$('previewOverlay').classList.contains('hidden')) closePreviewModal();
    });

    updateExportButtons();
    refreshAll(null);
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
