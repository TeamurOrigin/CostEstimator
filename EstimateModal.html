<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{
      --bg:#070d18;
      --panel:rgba(15,23,42,.72);
      --panel2:rgba(2,6,23,.42);
      --text:#e7eefc;
      --muted:#95a6c7;
      --border:rgba(148,163,184,.16);
      --border2:rgba(148,163,184,.10);
      --accent:#38bdf8;
      --green:#34d399;
      --red:#ef4444;
      --shadow:0 18px 70px rgba(0,0,0,.55);
      --shadow2:0 10px 28px rgba(0,0,0,.35);
      --r:16px;
      --r2:12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size:11.5px;
      line-height:1.2;
      color:var(--text);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
        radial-gradient(900px 420px at 88% 0%, rgba(52,211,153,.13), transparent 55%),
        radial-gradient(900px 520px at 50% 110%, rgba(99,102,241,.10), transparent 55%),
        linear-gradient(180deg, #060b16 0%, #040816 100%);
      overflow:hidden;
    }

    .wrap{
      height:100%;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .top{
      flex:0 0 auto;
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.82), rgba(15,23,42,.62));
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .top:before{
      content:"";
      position:absolute;inset:-2px;
      background:
        radial-gradient(600px 140px at 18% 0%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(600px 160px at 86% 0%, rgba(52,211,153,.14), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }
    .top > *{position:relative;z-index:1}
    .title{font-weight:950;font-size:14px;letter-spacing:.2px}
    .status{
      font-size:10.8px;color:var(--muted);
      padding:5px 9px;
      border:1px solid var(--border2);
      border-radius:999px;
      background:rgba(2,6,23,.40);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      white-space:nowrap;
    }

    .card{
      flex:1 1 auto;
      min-height:0;
      border:1px solid var(--border);
      border-radius:var(--r);
      background:linear-gradient(180deg, rgba(15,23,42,.76), rgba(2,6,23,.44));
      box-shadow:var(--shadow2);
      overflow:hidden;
      position:relative;
      display:flex;
      flex-direction:column;
    }
    .card:before{
      content:"";
      position:absolute;inset:0;
      background:
        radial-gradient(800px 220px at 22% 0%, rgba(56,189,248,.10), transparent 55%),
        radial-gradient(800px 220px at 82% 0%, rgba(52,211,153,.08), transparent 55%);
      pointer-events:none;
      opacity:.9;
    }
    .card > *{position:relative;z-index:1}

    .h{
      flex:0 0 auto;
      padding:10px 12px;
      border-bottom:1px solid var(--border2);
      font-weight:950;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:linear-gradient(180deg, rgba(2,6,23,.32), rgba(2,6,23,.12));
    }
    .b{
      flex:1 1 auto;
      min-height:0;
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    label{display:block;font-size:10.8px;color:var(--muted);margin:0 0 6px}
    input,select{
      width:100%;
      height:32px;
      padding:7px 10px;
      border-radius:12px;
      border:1px solid var(--border2);
      background:rgba(2,6,23,.44);
      color:var(--text);
      outline:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
      transition:box-shadow .12s ease,border-color .12s ease,transform .12s ease,background .12s ease;
    }
    input::placeholder{color:rgba(149,166,199,.55)}
    input:focus,select:focus{
      border-color:rgba(56,189,248,.55);
      box-shadow:0 0 0 3px rgba(56,189,248,.12), inset 0 1px 0 rgba(255,255,255,.04);
      background:rgba(2,6,23,.50);
    }

    .btn{
      height:32px;
      padding:0 12px;
      border-radius:12px;
      border:1px solid var(--border2);
      background:linear-gradient(180deg, rgba(2,6,23,.55), rgba(2,6,23,.35));
      color:var(--text);
      font-weight:950;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
      transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,filter .12s ease;
      white-space:nowrap;
    }
    .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .btn:active{transform:translateY(0)}
    .btn.acc{
      border-color:rgba(56,189,248,.45);
      box-shadow:0 0 0 3px rgba(56,189,248,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .btn.red{
      border-color:rgba(239,68,68,.45);
      box-shadow:0 0 0 3px rgba(239,68,68,.08), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .xbtn{
      height:28px;
      border-radius:11px;
      font-weight:950;
      padding:0 10px;
      font-size:11px;
    }

    .formGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      align-items:end;
    }
    .span2{grid-column:1 / -1}
    .createBtn{grid-column:1 / -1}

    .tableShell{
      flex:1 1 auto;
      min-height:0;
      border:1px solid var(--border2);
      border-radius:14px;
      overflow:auto;
      background:rgba(2,6,23,.22);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      font-size:11.1px;
      table-layout:fixed;
    }
    th,td{padding:7px 8px;border-bottom:1px solid rgba(148,163,184,.09);vertical-align:middle}
    th{
      color:rgba(149,166,199,.85);
      font-weight:950;
      text-align:left;
      background:rgba(2,6,23,.28);
      position:sticky;top:0;z-index:2;
      box-shadow:inset 0 -1px 0 rgba(148,163,184,.08);
      white-space:nowrap;
    }
    tbody tr:hover td{background:rgba(56,189,248,.05)}
    td.num{text-align:right}
    td.center{text-align:center}
    .ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .estActions{
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:stretch;
    }
    .estActions .btn{width:100%}

    @media (max-width: 640px){
      .wrap{padding:10px}
      .formGrid{grid-template-columns:1fr}
      .title{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Проекты</div>
      <div class="status" id="status">Загрузка…</div>
    </div>

    <div class="card" id="leftCard">
      <div class="h">Проекты</div>
      <div class="b">
        <div class="formGrid">
          <div class="span2">
            <label>Наименование проекта</label>
            <input id="newName" placeholder="Например: Энергетики">
          </div>
          <div>
            <label>Тип</label>
            <select id="newType"></select>
          </div>
          <div>
            <label>Группа</label>
            <input id="newGroup" placeholder="Например: Трансляция">
          </div>
          <button class="btn acc createBtn" id="btnCreate">Создать проект</button>
        </div>

        <div class="tableShell">
          <table>
            <colgroup>
              <col style="width:34%">
              <col style="width:18%">
              <col style="width:20%">
              <col style="width:10%">
              <col style="width:118px">
            </colgroup>
            <thead>
              <tr>
                <th>Проект</th>
                <th>Тип</th>
                <th>Группа</th>
                <th class="center">Позиции</th>
                <th class="center">Действия</th>
              </tr>
            </thead>
            <tbody id="estBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
  var boot=null;
  function $(id){return document.getElementById(id)}
  function setStatus(t){$('status').textContent=t}
  function arr(a){return a&&a.length?a:[]}

  function fillTypes(){
    var sel=$('newType'); sel.innerHTML='';
    var types=arr(boot&&boot.types);
    for(var i=0;i<types.length;i++){
      var o=document.createElement('option');
      o.value=types[i]; o.textContent=types[i];
      sel.appendChild(o);
    }
  }

  function renderEstimates(){
    var body=$('estBody'); body.innerHTML='';
    var list=arr(boot&&boot.estimates);

    if(!list.length){
      var tr=document.createElement('tr');
      var td=document.createElement('td');
      td.colSpan=6;
      td.style.padding='12px 10px';
      td.style.color='rgba(149,166,199,.85)';
      td.style.fontSize='11px';
      td.textContent='Смет пока нет';
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }

    for(var i=0;i<list.length;i++){
      var e=list[i];
      var tr=document.createElement('tr');

      var td1=document.createElement('td');
      td1.className='ellipsis';
      td1.textContent=e.name||'';
      td1.title=e.name||'';

      var td2=document.createElement('td');
      td2.className='ellipsis';
      td2.textContent=e.type||'';
      td2.title=e.type||'';

      var td3=document.createElement('td');
      td3.className='ellipsis';
      td3.textContent=e.group||'';
      td3.title=e.group||'';

      var td4=document.createElement('td');
      td4.className='center';
      td4.textContent=String(Number(e.itemsCount||0));

      var td5=document.createElement('td');
      td5.className='center';

      var box=document.createElement('div');
      box.className='estActions';

      var bOpen=document.createElement('button');
      bOpen.className='btn acc xbtn';
      bOpen.textContent='Открыть';
      bOpen.dataset.id=e.id;
      bOpen.addEventListener('click',function(ev){
        openEstimate(ev.currentTarget.dataset.id);
      });

      var bDel=document.createElement('button');
      bDel.className='btn red xbtn';
      bDel.textContent='Удалить';
      bDel.dataset.id=e.id;
      bDel.addEventListener('click',function(ev){
        delEstimate(ev.currentTarget.dataset.id);
      });

      box.appendChild(bOpen);
      box.appendChild(bDel);
      td5.appendChild(box);

      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);
      tr.appendChild(td4);
      tr.appendChild(td5);
      body.appendChild(tr);
    }
  }

  function refreshBootstrap(cb){
    google.script.run
      .withSuccessHandler(function(data){
        boot=data;
        fillTypes();
        renderEstimates();
        if(cb)cb();
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .getBootstrapData();
  }

  function openEstimate(id){
    setStatus('Открываю смету…');
    google.script.run
      .withSuccessHandler(function(){
        google.script.host.close();
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .openEstimateItems(id);
  }

  function delEstimate(id){
    setStatus('Удаление…');
    google.script.run
      .withSuccessHandler(function(){
        setStatus('Готово');
        refreshBootstrap();
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .deleteEstimate(id);
  }

  function init(){
    $('btnCreate').addEventListener('click',function(){
      var name=$('newName').value.trim();
      var type=$('newType').value.trim();
      var group=$('newGroup').value.trim();
      if(!name){setStatus('Укажите название');return}
      if(!type){setStatus('Укажите тип');return}
      if(!group){setStatus('Укажите группу');return}
      setStatus('Создание…');
      google.script.run
        .withSuccessHandler(function(est){
          $('newName').value='';
          $('newGroup').value='';
          setStatus('Готово');
          refreshBootstrap(function(){ openEstimate(est.id); });
        })
        .withFailureHandler(function(e){
          setStatus(String(e&&e.message?e.message:e));
        })
        .createEstimate({name:name,type:type,group:group});
    });

    setStatus('Загрузка…');
    google.script.run
      .withSuccessHandler(function(data){
        boot=data;
        fillTypes();
        renderEstimates();
        setStatus('Готово');
      })
      .withFailureHandler(function(e){
        setStatus(String(e&&e.message?e.message:e));
      })
      .getBootstrapData();
  }

  window.addEventListener('load',init);
</script>
</body>
</html>
